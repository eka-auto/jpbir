      // error the caller renders, with the key left alone. get() has already
      // classified this via _auth.js's `code`, so anything still carrying 503
      // here is the non-auth kind.
      if (error.status === 503) {
        renderS24Gate(error.message + ' Your key is still stored — this is a server configuration problem.');
        return;
      }
      throw error;
    });
  };

  RENDER.letters = function () {
    return get('letters').then(function (rows) {
      var el = $('page-letters');
      el.innerHTML = '<div class="card"><h3>Letters<span class="tag">' + num(rows.length) + '</span></h3><div class="body flush">' +
        table([
          { label: 'Token', render: function (r) { return '<span class="mono trunc" style="max-width:260px">' + esc(r.token) + '</span>'; } },
          { label: 'Created', render: function (r) { return when(r.created_at); } },
          { label: 'Status', render: function (r) {
              if (r.deleted_at) return '<span class="pill bad">expired</span>';
              if (r.read_at) return '<span class="pill ok">read</span>';
              return '<span class="pill warn">unread</span>';
            } },
          { label: 'Read at', render: function (r) { return when(r.read_at); } },
          { label: 'Recipient', render: function (r) { return '<span class="mono">' + esc(r.email || '—') + '</span>'; } },
          { label: 'Views', key: 'view_count', num: true },
          { label: 'Source', render: function (r) { return '<span class="mono">' + esc(r.source_system) + '</span>'; } }
        ], rows, { onRow: true }) + '</div>' +
        '<div class="pager">The blob copy is destroyed on read, so these rows are the only record a letter existed.</div></div>';
      wireRows(el, rows, function (row) {
        openDrawer('Letter ' + row.token,
          kvList(row, ['body']) +
          subHead('Letter body') +
          treeHtml(row.body || {}));
      });
    });
  };

  RENDER.emails = function () {
    return get('emails', { limit: 100, offset: state.offsets.emails }).then(function (d) {
      var el = $('page-emails');
      el.innerHTML =
        '<div class="grid" style="margin-bottom:12px">' +
          card('Opens by recipient', barList(d.byRecipient, 'label', 'n'), null, true) +
        '</div>' +
        '<div class="card"><h3>Opens<span class="tag">' + num(d.total) + ' total</span></h3><div class="body flush">' +
        table([
          { label: 'When', render: function (r) { return when(r.opened_at); } },
          { label: 'Ago', render: function (r) { return ago(r.opened_at); } },
          { label: 'Recipient', render: function (r) { return '<span class="mono">' + esc(r.email) + '</span>'; } },
          { label: 'Place', render: function (r) { return esc([r.city, r.country].filter(Boolean).join(', ') || '—'); } },
          { label: 'IP', render: function (r) { return '<span class="mono">' + esc(r.ip || '—') + '</span>'; } },
          { label: 'Via', render: function (r) { return '<span class="mono" style="color:var(--ink-faint)">' + esc(r.source_system || '—') + '</span>'; } },
          { label: 'Client', render: function (r) { return '<span class="trunc" style="max-width:240px">' + esc(r.user_agent || '—') + '</span>'; } }
        ], d.rows, { onRow: true }) + '</div>' + pager('emails', d) + '</div>';
      wireRows(el, d.rows, function (row) {
        openDrawer('Open · ' + row.email,
          kvList(row, ['payload']) +
          subHead('payload') +
          treeHtml(row.payload || {}));
      });
    });
  };

  RENDER.whatsapp = function () {
    return Promise.all([
      get('whatsapp', { limit: 100, offset: state.offsets.whatsapp }),
      readableWhatsAppInventory()
    ]).then(function (result) {
      var d = result[0];
      var inventory = result[1] || {};
      var realChats = (inventory.chats || []).filter(function (chat) {
        return Number(chat.readable_count) > 0;
      }).sort(function (a, b) {
        return Number(b.readable_count) - Number(a.readable_count) || String(a.name || '').localeCompare(String(b.name || ''));
      });
      var readableTotal = Number((inventory.totals || {}).readable) || 0;
      var t = d.totals || {};
      var el = $('page-whatsapp');
      el.innerHTML =
        '<div class="grid kpis" style="margin-bottom:12px">' +
          kpi('chats', num(t.chats), t.unresolved ? num(t.unresolved) + ' with no saved contact' : 'threads') +
          kpi('messages', num(t.messages), t.oldest ? whenText(t.oldest).split(',')[0] + ' → ' + whenText(t.newest).split(',')[0] : 'rows') +
          kpi('attachments', num(t.attachments), 'media rows') +
          kpi('sync runs', num(t.runs), 'pushes recorded') +
          kpi('real text', num(readableTotal), num(realChats.length) + ' chats') +
        '</div>' +
        '<div class="grid cards-2" style="margin-bottom:12px">' +
          card('Chats by kind', barList(d.byKind, 'label', 'n', { sub: 'messages' }), 'groups vs direct', true) +
          card('Recent syncs', table([
            // finished_at is selected by db-api, and a run that never finished has
            // to read "running…" rather than look like a completed one. The run's
            // own note rides underneath it, because that is where a partial run
            // says why -- the difference between a quiet night and a pipeline that
            // stopped.
            { label: 'Started', render: function (r) {
                var base = when(r.started_at);
                var tail = '';
                if (!r.finished_at) {
                  tail = ' <span class="muted">· running…</span>';
                } else {
                  var secs = Math.round((new Date(r.finished_at) - new Date(r.started_at)) / 1000);
                  if (isFinite(secs) && secs >= 0) {
                    tail = ' <span class="muted">· ' + (secs < 90 ? secs + 's' : Math.round(secs / 60) + 'm') + '</span>';
                  }
                }
                var note = r.note ? '<div style="color:var(--ink-faint);font-size:10.5px;margin-top:3px">' + esc(r.note) + '</div>' : '';
                return base + tail + note;
              } },
            // wa_sync_runs has its own two-value vocabulary (running | done);
            // s24Status() maps the device pipeline's words and knows neither.
            { label: 'Status', render: function (r) {
                var cls = r.status === 'done' ? 'ok' : r.status === 'running' ? 'warn' : 'mute';
                return '<span class="pill ' + cls + '">' + esc(r.status || '—') + '</span>';
              } },
            { label: 'Chats', key: 'chats_seen', num: true },
            { label: 'Messages', key: 'messages_seen', num: true },
            // 008_wa_sync_attachment_counts exists for these two numbers: a run
            // that discarded every attachment used to read exactly like a perfect
            // one, which is how wa_attachments stayed empty against 18,232 media
            // messages. Both columns are nullable on purpose -- a run written
            // before that migration is "unknown", so it prints — and never a 0
            // that would look like a clean run.
            { label: 'Attachments', render: function (r) { return num(r.attachments_seen); }, num: true },
            { label: 'Dropped', render: function (r) {
                if (r.attachments_skipped == null) return num(r.attachments_skipped);
                return Number(r.attachments_skipped) > 0
                  ? '<span class="pill bad">' + num(r.attachments_skipped) + '</span>'
                  : num(r.attachments_skipped);
              }, num: true },
            { label: 'Device', render: function (r) { return '<span class="mono">' + esc(r.device_id || '—') + '</span>'; } }
          ], d.runs), null, true) +
        '</div>' +
        '<div class="card" id="readable-wa-chats" style="margin-bottom:12px">' +
          '<h3>Chats with real text<span class="tag">' + num(realChats.length) + ' chats · ' + num(readableTotal) + ' messages</span></h3>' +
          '<div class="body flush">' + (realChats.length ? table([
            { label: 'Chat', render: function (r) { return esc(r.name || '(unnamed)'); } },
            { label: 'Kind', render: function (r) { return '<span class="pill info">' + esc(r.kind || '—') + '</span>'; } },
            { label: 'Real text', key: 'readable_count', num: true },
            { label: 'Stored rows', key: 'stored_count', num: true },
            { label: 'Last', render: function (r) { return r.last_at ? when(r.last_at).split(',')[0] : '—'; } }
          ], realChats, { onRow: true }) : '<div class="empty">No imported plaintext message bodies are stored yet.</div>') + '</div>' +
        '</div>' +
        '<div class="card" id="all-wa-chats">' +
          '<h3>Chats<span class="tag">' + num(d.total) + ' total · every property</span></h3>' +
          '<div class="body flush">' + table([
            { label: 'Chat', render: function (r) { return esc(r.name || '(unnamed)') + (r.unresolved ? ' <span class="pill warn">unsaved</span>' : ''); } },
            { label: 'Kind', render: function (r) { return '<span class="pill info">' + esc(r.kind) + '</span>'; } },
            { label: 'Messages', key: 'msg_count', num: true },
            // Sealed bodies are the single most misread number here: a chat can
            // show 4,000 messages and no readable text at all.
            { label: 'Sealed', render: function (r) { return r.enc_count ? '<span class="mono">' + num(r.enc_count) + '</span>' : '—'; }, num: true },
            { label: 'Media', key: 'media_count', num: true },
            { label: 'Audio', key: 'audio_count', num: true },
            { label: 'Calls', key: 'call_count', num: true },
            { label: 'Members', render: function (r) { return r.member_count == null ? '—' : num(r.member_count); }, num: true },
            { label: 'Last', render: function (r) { return r.last_at ? when(r.last_at).split(',')[0] : '—'; } }
          ], d.rows, { onRow: true }) + '</div>' +
          pager('whatsapp', d) +
        '</div>' +
        '<div style="color:var(--ink-faint);font-size:11.5px;padding:10px 2px 0">' +
          'wa_chats / wa_messages / wa_attachments carry no <span class="mono">site</span> column — one phone\'s export is not a ' +
          'property\'s traffic — so this page ignores the property selector, the same way Devices and the S24 archive do.' +
        '</div>';

      wireRows($('all-wa-chats'), d.rows, openWhatsAppDrawer);
      wireRows($('readable-wa-chats'), realChats, openWhatsAppDrawer);
    });
  };

  RENDER.health = function () {
    return Promise.all([get('health'), get('sites')]).then(function (r) {
      var h = r[0], sites = r[1];
      var cov = h.coverage || {}, total = cov.total || 1;
      // The events card below answers "is this field arriving" for the one table
      // the panels hang off. 008 added wa_sync_runs.attachments_seen and nothing
      // showed it -- a column that lands in no panel and no coverage row cannot
      // be told apart from data that never arrived. db-api builds this from
      // information_schema, so the next migration shows up here by itself.
      var covRows = (h.coverageByTable || []).map(function (t) {
        var cols = t.columns || [];
        return {
          table: t.table,
          total: t.total,
          columnCount: cols.length,
          filled: cols.filter(function (c) { return Number(c.filled) > 0; }).length,
          empty: cols.filter(function (c) { return !Number(c.filled); }).map(function (c) { return c.name; }),
          // Every column by name, so a populated new column is still findable
          // ("is attachments_seen covered?") and not only the empty ones.
          title: cols.map(function (c) { return c.name + ' ' + num(c.filled); }).join(', ')
        };
      });
      var fields = Object.keys(cov).filter(function (k) { return k !== 'total'; });
      var bars = fields.map(function (k) {
        var pct = (cov[k] / total) * 100;
        var color = pct > 90 ? 'var(--ok)' : pct > 40 ? 'var(--warn)' : 'var(--bad)';
        return '<div class="cov"><div style="color:var(--ink-dim)">' + esc(k.replace(/^with_/, '')) + '</div>' +
          '<div class="track"><div class="fill" style="width:' + pct.toFixed(1) + '%;background:' + color + '"></div></div>' +
          '<div class="pct">' + pct.toFixed(0) + '%</div></div>';
      }).join('');
      $('page-health').innerHTML =
        '<div class="grid kpis" style="margin-bottom:12px">' +
          Object.keys(h.counts).map(function (t) {
            var scoped = (h.countsForSite || {})[t];
            return kpi(t.replace(/_/g, ' '), num(h.counts[t]),
              scoped != null && scoped !== h.counts[t] ? num(scoped) + ' for this property' : 'rows');
          }).join('') +
        '</div>' +
        '<div class="grid cards-2">' +
          card('Field coverage on events', bars + '<div style="margin-top:10px;color:var(--ink-faint);font-size:11.5px">' +
            'Share of the ' + num(cov.total) + ' event rows where the column is populated. A panel that looks empty should be checked here first — ' +
            'low coverage means the field is not arriving, not that the UI is broken.</div>') +
          card('Column coverage by table', table([
            { label: 'Table', render: function (r) { return '<span class="mono">' + esc(r.table) + '</span>'; } },
            { label: 'Rows', key: 'total', num: true },
            { label: 'Columns', render: function (r) {
                return '<span title="' + esc(r.title) + '">' + num(r.filled) + ' / ' + num(r.columnCount) + '</span>';
              }, num: true },
            { label: 'Empty columns', render: function (r) {
                if (!r.empty.length) return '<span class="muted">all populated</span>';
                return '<span class="trunc" title="' + esc(r.empty.join(', ')) + '">' + esc(r.empty.join(', ')) + '</span>';
              } }
          ], covRows), covRows.length + ' tables', true) +
          card('Where the rows came from', table([
            { label: 'Source', render: function (r) { return '<span class="mono">' + esc(r.source_system) + '</span>'; } },
            { label: 'Rows', key: 'n', num: true },
            { label: 'Oldest', render: function (r) { return when(r.oldest); } },
            { label: 'Newest', render: function (r) { return when(r.newest); } }
          ], h.sources) +
          '<div style="padding:12px 0 0">' + table([
            { label: 'Property', render: function (r) { return '<span class="mono">' + esc(r.site) + '</span>'; } },
            { label: 'Events', key: 'events', num: true },
            { label: 'Visitors', key: 'visitors', num: true },
            { label: 'First', render: function (r) { return when(r.first_event_at); } },
            { label: 'Last', render: function (r) { return when(r.last_event_at); } }
          ], sites) + '</div>', null, true) +
        '</div>';
    });
  };

  // ---------- shared wiring ----------
  function pager(key, res) {
    var total = Number(res.total) || 0;
    var from = total ? res.offset + 1 : 0, to = Math.min(res.offset + res.limit, total);
    var attrs = ' data-pg="' + key + '" data-step="' + res.limit + '" data-total="' + res.total + '"';
    return '<div class="pager">' +
      '<button class="btn"' + attrs + ' data-dir="-1"' + (res.offset ? '' : ' disabled') + '>Prev</button>' +
      '<button class="btn"' + attrs + ' data-dir="1"' + (to >= res.total ? ' disabled' : '') + '>Next</button>' +
      '<span>' + num(res.total ? from : 0) + '–' + num(Math.max(to, 0)) + ' of ' + num(res.total) + '</span></div>';
  }

  function wireRows(root, rows, onClick) {
    Array.prototype.forEach.call(root.querySelectorAll('tr.clickable'), function (tr) {
      tr.addEventListener('click', function () {
        var row = rows[Number(tr.getAttribute('data-i'))];
        if (row) onClick(row);
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-pg]'), function (b) {
      b.addEventListener('click', function () {
        if (b.disabled) return;
        var k = b.getAttribute('data-pg');
        var step = Number(b.getAttribute('data-step')) || 100;
        var cap = Math.max(0, (Number(b.getAttribute('data-total')) || 0) - 1);
        // Clamp. Turning the noise filter back on shrinks the result set, and an
        // offset left past the new end printed ranges like "2,001-500 of 500".
        state.offsets[k] = Math.min(cap, Math.max(0, (state.offsets[k] || 0) + Number(b.getAttribute('data-dir')) * step));
        draw();
      });
    });
  }

  // ---------- shell ----------
  function buildNav() {
    $('nav').innerHTML = PAGES.map(function (p) {
      return '<button data-page="' + p[0] + '" class="' + (state.page === p[0] ? 'on' : '') + '">' +
        '<span class="dot"></span>' + esc(p[1]) +
        (p[2] ? '<span class="count" data-count="' + p[2] + '"></span>' : '') + '</button>';
    }).join('');
    Array.prototype.forEach.call($('nav').querySelectorAll('[data-page]'), function (b) {
      b.addEventListener('click', function () {
        state.page = b.getAttribute('data-page');
        buildNav();
        draw();
      });
    });
    applyCounts();
  }

  function applyCounts() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-count]'), function (el) {
      var v = state.counts[el.getAttribute('data-count')];
      el.textContent = v == null ? '' : num(v);
    });
  }

  function draw() {
    clearErr();
    var id = 'page-' + state.page;
    Array.prototype.forEach.call(document.querySelectorAll('.page'), function (p) {
      p.classList.toggle('on', p.id === id);
    });
    var page = PAGES.filter(function (p) { return p[0] === state.page; })[0];
    $('title').textContent = page ? page[1] : state.page;
    var el = $(id);
    if (!el.innerHTML) el.innerHTML = '<div class="empty">Loading…</div>';
    var token = ++drawToken;
    var render = RENDER[state.page] || function () { return Promise.resolve(); };
    var pending;
    // Tag every get() the renderer starts with this draw's token; see
    // renderingToken. A renderer that throws before returning its promise is
    // routed to the same error path instead of escaping draw().
    renderingToken = token;
    try { pending = Promise.resolve(render()); } catch (err) { pending = Promise.reject(err); } finally { renderingToken = 0; }
    pending.catch(function (e) {
      if (token !== drawToken) return;
      // A handled lock has already drawn the unlock form into this very
      // element. Overwriting it with an error view would leave the operator
      // locked out with no way back in.
      if (e && e.handled) return;
      // Write the failure into the page itself. Sending it only to the shared
      // banner left the page stuck on "Loading…", and the next draw wiped the
      // banner — so the error vanished with nothing to show for it.
      el.innerHTML = '<div class="err">' + esc(e && e.message ? e.message : String(e)) + '</div>';
      fail(e);
    });
  }

  function loadSites() {
    return get('sites').then(function (sites) {
      $('siteSel').innerHTML = sites.map(function (s) {
        return '<option value="' + esc(s.site) + '">' + esc(s.site) + ' · ' + num(s.events) + '</option>';
      }).join('');
      if (sites.length && !sites.some(function (s) { return s.site === state.site; })) state.site = sites[0].site;
      $('siteSel').value = state.site;
    });
  }

  // loadSites() settled either way: its failure, if any, as a value, so the
  // caller can report it AFTER draw(). draw() clears the banner on its way in,
  // which is how a failed property list used to vanish unexplained, leaving
  // #siteSel empty beside a page drawn for the default property.
  function loadSitesSettled() {
    return loadSites().then(function () { return null; }, function (e) { return e; });
  }

  function boot() {
    // Resolve the property list BEFORE the first draw. Drawing first meant that
    // when the default property had no rows, the first paint showed all-zero
    // KPIs while the dropdown beside it already named a different, real one.
    loadSitesSettled().then(function (sitesError) {
      buildNav();
      draw();
      if (sitesError) fail(sitesError);
      return refreshCounts();
    });
  }

  // Both gates used to call draw() alone after taking a key. On a first visit
  // boot's other two requests -- the property list and the health counts --
  // had already failed behind the gate, and nothing ran them again, so after a
  // successful unlock #siteSel stayed empty and the nav badges and footer
  // stayed blank until a manual reload. Same order as boot(): the property list
  // first, because it can change state.site, which every page is drawn for.
  function reloadAfterUnlock() {
    keyRejected = false;
    loadSitesSettled().then(function (sitesError) {
      // A refused key has already put the gate back up with its reason, and a
      // draw now would only replace it with the same gate.
      if (sitesError && sitesError.handled) return;
      draw();
      if (sitesError) fail(sitesError);
      return refreshCounts();
    });
  }

  // The S24 page's lock button cleared the SHARED key -- the one every page of
  // this dashboard reads, and index.html, /s24, /vivobook, /agent and /jteka
  // with it -- while its label, "Lock archive", promised only the archive. It
  // is labelled for what it does, and it now locks the whole page the way the
  // label says: every section keeps the HTML it last drew while hidden, so
  // after the old lock the next nav click showed that page's data again until
  // its 401 arrived. Responses still in flight for the unlocked session are
  // dropped rather than painted behind the gate: lockEpoch covers every
  // request, and superseding the current draw also silences its error path.
  function lockDashboard() {
    state.s24Key = '';
    keyRejected = false;
    clearDashboardKey();
    lockEpoch++;
    drawToken++;
    drawerToken++;
    // Closing only hides the drawer; the record it last showed -- an SMS, a
    // call, a file -- would still sit in the DOM behind the gate.
    closeDrawer();
    $('drawerTitle').textContent = 'Detail';
    $('drawerBody').innerHTML = '';
    clearErr();
    Array.prototype.forEach.call(document.querySelectorAll('.page'), function (p) { p.innerHTML = ''; });
    $('siteSel').innerHTML = '';
    state.counts = {};
    applyCounts();
    $('foot').textContent = '—';
    renderS24Gate('Dashboard locked. Enter the dashboard key to unlock it again.');
  }

  // Tokened like draw(): a property switch and an unlock can each start one,
  // and the older response arriving last would label the pages with the
  // previous property's counts.
  var countsToken = 0;
  function refreshCounts() {
    var token = ++countsToken;
    return get('health').then(function (h) {
      if (token !== countsToken) return;
      // Site-scoped, because the pages these badges label are themselves
      // site-filtered. A global total beside a filtered page reads as a bug.
      state.counts = h.countsForSite || h.counts || {};
      applyCounts();
      $('foot').textContent = num((h.counts || {}).events) + ' events, all properties · ' +
        (h.span && h.span.newest ? ago(h.span.newest) : '—');
    }).catch(fail);
  }

  function resetPaging() { state.offsets = { visitors: 0, sessions: 0, events: 0, video: 0, emails: 0, s24: 0, whatsapp: 0 }; }

  $('siteSel').addEventListener('change', function () {
    state.site = this.value;
    resetPaging();
    // A type chip from the previous property may not exist in the new one,
    // which rendered "0 matching" with no chip lit and no obvious way back.
    state.type = '';
    Array.prototype.forEach.call(document.querySelectorAll('.page'), function (p) { p.innerHTML = ''; });
    draw();
    refreshCounts();
  });
  $('daysSel').addEventListener('change', function () { state.days = Number(this.value); resetPaging(); draw(); });
  $('noiseBtn').addEventListener('click', function () {
    state.noise = !state.noise;
    this.classList.toggle('on', state.noise);
    this.textContent = state.noise ? 'Noise on' : 'Noise off';
    resetPaging();
    draw();
  });
  $('refreshBtn').addEventListener('click', draw);

  boot();
})();
</script>
</body>
