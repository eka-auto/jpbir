<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Create your account · Jayti</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #1c1007; color: #221a15; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(440px, calc(100% - 32px)); margin: 10vh auto; padding: 32px; border-radius: 16px; background: #fff8ee; }
    h1 { font: 600 30px/1.2 Georgia, serif; margin: 0 0 12px; }
    p { color: #6c5f53; }
    label { display: block; margin: 18px 0; font-weight: 600; }
    input { display: block; width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #968373; border-radius: 7px; font: inherit; }
    button { padding: 12px 16px; min-height: 44px; border: 0; border-radius: 7px; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #submit, #sign-out, #verify-email { background: #8e4a07; color: white; }
    #submit { width: 100%; }
    #toggle-mode { background: transparent; color: #71400e; padding-left: 0; text-align: left; }
    a { color: #71400e; }
    :focus-visible { outline: 3px solid #c87a1e; outline-offset: 3px; }
    [hidden] { display: none !important; }
    #message { min-height: 24px; overflow-wrap: anywhere; }
    #message[data-error="true"] { color: #a12520; }
    #current-email { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1 id="heading">Create your account</h1>
    <p>Sign up with your email and a password.</p>
    <p id="message" role="status" aria-live="polite">Loading sign-in…</p>
    <form id="account-form">
      <label>Name<input id="name" name="name" autocomplete="name" maxlength="100" required></label>
      <label>Email<input id="email" name="email" type="email" autocomplete="email" maxlength="254" required></label>
      <label>Password<input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
      <button id="submit" type="submit" disabled>Create account</button>
    </form>
    <button id="toggle-mode" type="button" disabled>Already have an account? Sign in</button>
    <button id="open-verification" type="button" disabled>Verify an existing account</button>
    <form id="verification-form" hidden>
      <h2>Verify your email</h2>
      <label>Verification email<input id="verification-email" type="email" autocomplete="email" maxlength="254" required></label>
      <button id="send-code" type="button">Send verification code</button>
      <label>Verification code<input id="verification-code" type="password" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required></label>
      <button id="verify-email" type="submit">Verify email</button>
    </form>
    <section id="account" hidden aria-label="Your account">
      <h2>Signed in</h2>
      <p id="current-name"></p>
      <p id="current-email"></p>
      <button id="sign-out" type="button">Sign out</button>
    </section>
    <p><a href="/">Back to dashboard</a></p>
  </main>
  <script type="module" src="/assets/signup.bundle.js"></script>
</body>
</html>
