name: Verify Secrets

on:
  workflow_dispatch:  # Manual trigger

jobs:
  verify-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify SSH_PUBKEY_PRIMARY
        run: |
          if [ -n "${{ secrets.SSH_PUBKEY_PRIMARY }}" ]; then
            echo "✅ SSH_PUBKEY_PRIMARY is set"
            echo "Key type: $(echo '${{ secrets.SSH_PUBKEY_PRIMARY }}' | cut -d' ' -f1)"
          else
            echo "❌ SSH_PUBKEY_PRIMARY is NOT set"
            exit 1
          fi

      - name: Verify FIREBASE_SERVICE_ACCOUNT_JSON
        run: |
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "✅ FIREBASE_SERVICE_ACCOUNT_JSON is set"
            # Validate it's proper JSON
            echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" | python3 -m json.tool > /dev/null && echo "✅ Valid JSON format"
            # Check project_id
            PROJECT_ID=$(echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" | python3 -c "import sys, json; print(json.load(sys.stdin)['project_id'])")
            echo "Project ID: $PROJECT_ID"
          else
            echo "❌ FIREBASE_SERVICE_ACCOUNT_JSON is NOT set"
            exit 1
          fi

      - name: Verify STATS_KEY
        run: |
          if [ -n "${{ secrets.STATS_KEY }}" ]; then
            echo "✅ STATS_KEY is set"
            echo "Key length: ${#STATS_KEY} characters"
            if [ ${#STATS_KEY} -ge 32 ]; then
              echo "✅ Key meets minimum length requirement (32 chars)"
            else
              echo "⚠️  Key is shorter than 32 characters"
            fi
          else
            echo "❌ STATS_KEY is NOT set"
            exit 1
          fi

      - name: Verify SSH keys from existing secrets
        run: |
          echo "Checking other SSH-related secrets..."
          if [ -n "${{ secrets.PHONE_DAEMON_KEY }}" ]; then
            echo "✅ PHONE_DAEMON_KEY is set"
          fi
          if [ -n "${{ secrets.VIVOBOOK_DAEMON_KEY }}" ]; then
            echo "✅ VIVOBOOK_DAEMON_KEY is set"
          fi
          if [ -n "${{ secrets.LENOVO_DAEMON_KEY }}" ]; then
            echo "✅ LENOVO_DAEMON_KEY is set"
          fi

      - name: Summary
        run: |
          echo ""
          echo "========================================"
          echo "  SECRETS VERIFICATION COMPLETE"
          echo "========================================"
          echo ""
          echo "Required secrets:"
          echo "  ✅ SSH_PUBKEY_PRIMARY"
          echo "  ✅ FIREBASE_SERVICE_ACCOUNT_JSON"
          echo "  ✅ STATS_KEY"
          echo ""
          echo "Additional secrets found:"
          echo "  ✅ CONNECT_CLIENT_ID"
          echo "  ✅ LENOVO_DAEMON_KEY"
          echo "  ✅ PHONE_DAEMON_KEY"
          echo "  ✅ VERCEL_TOKEN"
          echo "  ✅ VIVOBOOK_DAEMON_KEY"
          echo ""
          echo "All secrets are properly configured!"
          echo "========================================"
