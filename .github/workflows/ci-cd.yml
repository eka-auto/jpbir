name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Contract rule 3: the build, the tests and the lint run inside
      # project/environment/run and nowhere else. They used to run directly on
      # the runner, which meant the green tick described the runner's Node and
      # the runner's Postgres rather than the pinned environment the product
      # is built in — the same class of mistake the manifest exists to stop.
      - name: Build the project environment
        run: docker compose -f project/environment/compose.yaml build dev

      # `--if-present` made both of these no-ops when the script was missing
      # or renamed, and a CI step that cannot fail is a step that says
      # nothing. The scripts exist; if one stops existing, the build stops.
      - name: Lint inside the project environment
        run: docker compose -f project/environment/compose.yaml run --rm dev npm run lint

      - name: Test inside the project environment
        run: docker compose -f project/environment/compose.yaml run --rm dev npm test

      # The pinned subject digests must match the tree. A subject file edited
      # without re-pinning it would leave the panel's contract and migration
      # rows permanently unproven, so the build fails instead.
      - name: Check the pinned evidence subjects
        run: docker compose -f project/environment/compose.yaml run --rm dev node scripts/stack-subjects.mjs --check

      # Chromium's browser binary, not just its libraries. The image carries
      # the shared libraries; the browser itself is installed here, inside the
      # environment, so the browser check exercises the same runtime the
      # manifest describes.
      - name: Install Chromium in the project environment
        run: docker compose -f project/environment/compose.yaml run --rm dev npx playwright install chromium

      - name: Run browser checks inside the project environment
        run: docker compose -f project/environment/compose.yaml run --rm dev npm run test:browser

  s24-mcp-runtime:
    name: S24 MCP compatibility (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated MCP dependencies
        run: |
          python -m venv "$RUNNER_TEMP/s24-mcp"
          "$RUNNER_TEMP/s24-mcp/bin/python" -m pip install -r Integrations/s24-connect-mcp/requirements.txt
      - name: Exercise real MCP stdio handshake and fail-closed ping
        run: '"$RUNNER_TEMP/s24-mcp/bin/python" Integrations/s24-connect-mcp/smoke_test.py'

  # Nothing ever validated the workflow files themselves, and it cost a release.
  #
  # s24-export-sync.yml shipped with `SYNC_ROOT: ${{ runner.temp }}/s24-sync` in
  # WORKFLOW-level env. The `runner` context is only available in a step's env,
  # so that expression resolved to the empty string, SYNC_ROOT became the
  # unwritable path "/s24-sync", and both halves of the export pipeline would
  # have failed on every scheduled run. A YAML parse does not catch that -- the
  # file is perfectly well-formed YAML. actionlint checks context availability
  # per workflow key, which is exactly the class of bug involved.
  #
  # Run from the upstream-published image at a pinned tag rather than a
  # third-party marketplace action, so the only new trust here is rhysd's own
  # release. Pinned, not :latest, so a lint rule added upstream cannot turn a
  # green pipeline red without a commit here.
  workflow-lint:
    name: Validate workflow definitions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint:1.7.12 -color -verbose

  # Server/jp-agent is its own package.json, so neither `npm ci` nor `npm test` above ever
  # touched it. Its tests existed and passed by hand, but nothing ran them - so two fixes to
  # device-health.mjs on 2026-09-19 (0637de9, 9040523) went in with CI green that meant
  # nothing for the runtime.
  #
  # The runtime is the Render web service jp-agent (render.yaml, project/targets.json), which
  # deploys from git and cannot be rolled back from here, so the last step checks the failure
  # a refactor is most likely to cause: the service dying at start with ERR_MODULE_NOT_FOUND.
  # Importing s24-tools.mjs resolves everything server.mjs imports (s24-tools ->
  # device-health -> s24-attestation). server.mjs itself calls listen() at import, so it only
  # gets a syntax check.
  jp-agent:
    name: jp-agent tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server/jp-agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: Server/jp-agent/package-lock.json

      - name: Install jp-agent dependencies
        run: npm ci

      - name: Run device-health tests
        run: node --test "tests/*.test.mjs"

      # The token-sync tests were removed together with sync-auth-token.py in
      # 2949662a. With no test_*.py left under Server/jp-agent/tests, unittest
      # exits 5 ("NO TESTS RAN") and fails the job, so the step went with them.
      - name: Check the shipped module graph resolves
        run: |
          node --check server.mjs
          node --input-type=module -e "await import('./s24-tools.mjs')"

  # A second deploy path was removed here on 2026-09-18.
  #
  # This job ran `vercel link --yes --project jpbir_restructured` and then
  # `vercel deploy --prod` on every push to main. Three problems, in order of
  # how much they cost:
  #
  #   1. jpbir_restructured is not production. It has no custom domain and one
  #      env var (STATS_KEY), so every data route on it answers 500 while the
  #      check beside it reported "Deploy to Production" in green. Real
  #      production - jaytipargal.tech, project jayti-dashboard - is deployed
  #      by Vercel's Git integration, which needs no workflow.
  #   2. `vercel link --yes --project <name>` CREATES the project when it is
  #      absent. The original jpbir_restructured was deleted once; this job
  #      recreated it on the next push, empty, and it accumulated 89
  #      deployments. Deleting the project without deleting this job just
  #      starts that over.
  #   3. A CLI deploy uploads the working directory, not the committed tree.
  #      That is why .vercelignore exists - to keep an untracked app/ holding
  #      a live service-account key out of a deployment. The ignore file is
  #      still worth having; needing it here was the symptom.
  #
  # Deploys come from the Git integration. This workflow lints and tests.
