name: S24 connection diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check phone credential and pinned connection endpoints
        env:
          PHONE_DAEMON_KEY: ${{ secrets.PHONE_DAEMON_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PUBKEY_PRIMARY: ${{ secrets.SSH_PUBKEY_PRIMARY }}
        run: |
          python3 - <<'PY'
          import json, os, socket, subprocess, tempfile
          key = os.environ.get('PHONE_DAEMON_KEY', '').strip()
          hosts = os.environ.get('SSH_KNOWN_HOSTS', '')
          pub = os.environ.get('SSH_PUBKEY_PRIMARY', '').strip()
          result = {'phoneCredentialPresent': bool(key), 'primaryPublicKeyPresent': bool(pub)}
          try:
              data = json.loads(key)
          except (ValueError, TypeError):
              data = None
          if isinstance(data, dict):
              result['phoneCredentialKind'] = 'google_service_account' if data.get('type') == 'service_account' else 'json_configuration'
              result['phoneCredentialHasEndpoint'] = any(data.get(k) for k in ('host', 'hostname', 'sshHost', 'tunnelHost', 'endpoint', 'url'))
              result['phoneCredentialHasUsername'] = any(data.get(k) for k in ('user', 'username', 'sshUser'))
          elif 'PRIVATE KEY-----' in key:
              result['phoneCredentialKind'] = 'private_key'
              with tempfile.TemporaryDirectory() as td:
                  keyfile = os.path.join(td, 'phone_key')
                  fd = os.open(keyfile, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
                  with os.fdopen(fd, 'w') as f:
                      f.write(key + '\n')
                  checked = subprocess.run(['ssh-keygen', '-y', '-P', '', '-f', keyfile], capture_output=True, timeout=5)
                  result['usableUnencryptedSshPrivateKey'] = checked.returncode == 0
                  if checked.returncode == 0:
                      derived = checked.stdout.decode().split()
                      expected = pub.split()
                      result['matchesPrimaryPublicKey'] = len(expected) >= 2 and derived[:2] == expected[:2]
          else:
              result['phoneCredentialKind'] = 'opaque_token' if key else 'missing'
          entries = 0
          hashed = 0
          candidates = []
          for line in hosts.splitlines():
              if not line.strip() or line.lstrip().startswith('#'):
                  continue
              parts = line.split()
              if parts[0].startswith('@'):
                  parts = parts[1:]
              if len(parts) < 3:
                  continue
              entries += 1
              for target in parts[0].split(','):
                  if target.startswith('|'):
                      hashed += 1
                      continue
                  host, port = target, 22
                  if target.startswith('[') and ']:' in target:
                      host, p = target[1:].rsplit(']:', 1)
                      if not p.isdigit():
                          continue
                      port = int(p)
                  if any(x in host.lower() for x in ('s24', 'phone', 'bore.pub')) and not any(x in host for x in '*?!'):
                      if (host, port) not in candidates:
                          candidates.append((host, port))
          result['knownHostEntryCount'] = entries
          result['hashedHostCount'] = hashed
          result['phoneNamedEndpointCount'] = len(candidates)
          result['endpointProbes'] = []
          for i, (host, port) in enumerate(candidates[:4], 1):
              probe = {'candidate': i, 'tcpConnected': False, 'sshBanner': False}
              try:
                  with socket.create_connection((host, port), timeout=5) as sock:
                      probe['tcpConnected'] = True
                      sock.settimeout(3)
                      probe['sshBanner'] = sock.recv(100).startswith(b'SSH-')
              except (OSError, ValueError):
                  pass
              result['endpointProbes'].append(probe)
          result['deviceAuthenticated'] = False
          result['deviceMutationsPerformed'] = False
          print('S24_DIAGNOSTIC=' + json.dumps(result, sort_keys=True))
          PY
