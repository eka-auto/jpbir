name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint --if-present
      
      - name: Run tests
        run: npm test --if-present

  # Nothing ever validated the workflow files themselves, and it cost a release.
  #
  # s24-export-sync.yml shipped with `SYNC_ROOT: ${{ runner.temp }}/s24-sync` in
  # WORKFLOW-level env. The `runner` context is only available in a step's env,
  # so that expression resolved to the empty string, SYNC_ROOT became the
  # unwritable path "/s24-sync", and both halves of the export pipeline would
  # have failed on every scheduled run. A YAML parse does not catch that -- the
  # file is perfectly well-formed YAML. actionlint checks context availability
  # per workflow key, which is exactly the class of bug involved.
  #
  # Run from the upstream-published image at a pinned tag rather than a
  # third-party marketplace action, so the only new trust here is rhysd's own
  # release. Pinned, not :latest, so a lint rule added upstream cannot turn a
  # green pipeline red without a commit here.
  workflow-lint:
    name: Validate workflow definitions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint:1.7.12 -color -verbose

  # Server/jp-agent is the droplet runtime and has its own package.json, so neither `npm ci`
  # nor `npm test` above ever touched it. Its tests existed and passed by hand, but nothing
  # ran them - so two fixes to device-health.mjs on 2026-09-19 (0637de9, 9040523) went in
  # with CI green that meant nothing for the droplet.
  #
  # The droplet is deployed by hand (deploy.sh), and a mistake there cannot be rolled back
  # from here, so the last step checks the failure a refactor is most likely to cause: the
  # service dying at start with ERR_MODULE_NOT_FOUND. Importing s24-tools.mjs resolves
  # everything server.mjs imports (s24-tools -> device-health -> s24-attestation).
  # server.mjs itself calls listen() at import, so it only gets a syntax check.
  jp-agent:
    name: jp-agent (droplet) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server/jp-agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: Server/jp-agent/package-lock.json

      - name: Install jp-agent dependencies
        run: npm ci

      - name: Run device-health tests
        run: node --test "tests/*.test.mjs"

      - name: Run token-sync tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check the shipped module graph resolves
        run: |
          node --check server.mjs
          node --input-type=module -e "await import('./s24-tools.mjs')"

  # A second deploy path was removed here on 2026-09-18.
  #
  # This job ran `vercel link --yes --project jpbir_restructured` and then
  # `vercel deploy --prod` on every push to main. Three problems, in order of
  # how much they cost:
  #
  #   1. jpbir_restructured is not production. It has no custom domain and one
  #      env var (STATS_KEY), so every data route on it answers 500 while the
  #      check beside it reported "Deploy to Production" in green. Real
  #      production - jaytipargal.tech, project jayti-dashboard - is deployed
  #      by Vercel's Git integration, which needs no workflow.
  #   2. `vercel link --yes --project <name>` CREATES the project when it is
  #      absent. The original jpbir_restructured was deleted once; this job
  #      recreated it on the next push, empty, and it accumulated 89
  #      deployments. Deleting the project without deleting this job just
  #      starts that over.
  #   3. A CLI deploy uploads the working directory, not the committed tree.
  #      That is why .vercelignore exists - to keep an untracked app/ holding
  #      a live service-account key out of a deployment. The ignore file is
  #      still worth having; needing it here was the symptom.
  #
  # Deploys come from the Git integration. This workflow lints and tests.
