name: Debug Vercel Projects

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Install Vercel CLI
        run: npm i -g vercel
      - name: List projects
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel projects ls --token ${{ secrets.VERCEL_TOKEN }}
      - name: List domains
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel domains ls --token ${{ secrets.VERCEL_TOKEN }}
      - name: List aliases
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel alias ls --token ${{ secrets.VERCEL_TOKEN }}
