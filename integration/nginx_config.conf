# Nginx Configuration for jaytibirthday.in Analytics Integration
# Background analytics routing - doesn't affect main site SEO

# Main server block for jaytibirthday.in
server {
    listen 80;
    listen [::]:80;
    server_name jaytibirthday.in www.jaytibirthday.in;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jaytibirthday.in www.jaytibirthday.in;
    
    # SSL configuration - Use your actual certificates
    ssl_certificate /etc/ssl/certs/jaytibirthday.in.crt;
    ssl_certificate_key /etc/ssl/private/jaytibirthday.in.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Root directory for main website
    root /var/www/jaytibirthday.in;
    index index.html index.htm;
    
    # Main website location
    location / {
        # Your existing website configuration goes here
        
        # Add the analytics JavaScript snippet
        # This adds the tracking script to your HTML pages
        sub_filter '</head>' '<script async defer src="/assets/js/jaytibirthday-analytics.js"></script></head>';
        sub_filter_once on;
        
        try_files $uri $uri/ /index.html;
    }
    
    # Analytics API endpoint (background)
    location /_analytics/ {
        # Internal proxy to analytics agent
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache settings for analytics endpoints
        proxy_cache off;
        proxy_buffering off;
        
        # Don't affect SEO
        add_header X-Robots-Tag "noindex, nofollow";
        
        # Security headers specific to analytics
        add_header Access-Control-Allow-Origin "https://jaytibirthday.in";
        add_header Access-Control-Allow-Methods "GET, POST";
        add_header Access-Control-Allow-Headers "Content-Type";
    }
    
    # Analytics dashboard (admin only)
    location /_analytics/dashboard {
        # Basic auth for admin access
        auth_basic "Analytics Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd-analytics;
        
        proxy_pass http://127.0.0.1:3001/dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Analytics API endpoints
    location /_analytics/api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Rate limiting for API
        limit_req zone=analytics burst=120 nodelay;
        limit_req_status 429;
    }
    
    # Static assets for analytics JS
    location /assets/js/jaytibirthday-analytics.js {
        alias /var/www/analytics/jaytibirthday-analytics.min.js;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Health check endpoint
    location /_analytics/health {
        proxy_pass http://127.0.0.1:3001/health;
        proxy_set_header Host $host;
        access_log off;
    }
    
    # Static assets location
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Block access to sensitive files
    location ~ /\. {
        deny all;
    }
    
    location ~* \.(log|sql|db)$ {
        deny all;
    }
}

# Rate limiting zone for analytics
limit_req_zone $binary_remote_addr zone=analytics:10m rate=60r/m;

# Separate server block for analytics subdomain (optional)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name analytics.jaytibirthday.in;
    
    # SSL configuration (can use same cert)
    ssl_certificate /etc/ssl/certs/jaytibirthday.in.crt;
    ssl_certificate_key /etc/ssl/private/jaytibirthday.in.key;
    
    # Analytics dashboard only
    location / {
        auth_basic "Analytics Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd-analytics;
        
        proxy_pass http://127.0.0.1:3001/dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Don't index analytics subdomain
    add_header X-Robots-Tag "noindex, nofollow, noarchive";
}

# Monitoring and metrics endpoint
server {
    listen 127.0.0.1:9090;
    server_name localhost;
    
    location /metrics {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}