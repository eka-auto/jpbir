name: Endpoint Health Check

on:
  deployment_status:
  schedule:
    - cron: '*/15 * * * *'  # Run every 15 minutes
  workflow_dispatch:

jobs:
  health-check:
    name: Check Endpoint Health
    runs-on: ubuntu-latest
    # Only a PRODUCTION deployment, the schedule, or a manual run. The probes
    # below read jaytipargal.tech, which is production — so a preview
    # deployment triggering this job was a category error: it checked the live
    # product while a branch was being reviewed, and its verdict had nothing
    # to say about the branch. It also made every pull request red whenever
    # production was behind the branch.
    #
    # The schedule covers production continuously whatever else happens, so
    # nothing is lost by dropping the preview trigger.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Production'))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      
      - name: Wait for deployment (if triggered by deployment)
        if: github.event_name == 'deployment_status'
        run: sleep 30
        shell: bash
      
      - name: Test Homepage
        run: |
          RESPONSE=$(curl -sL -o /dev/null -w "%{http_code}" https://jaytipargal.tech/)
          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ Homepage OK"
          else
            echo "❌ Homepage failed with status $RESPONSE"
            exit 1
          fi
      
      # These API probes are key-gated, and this probe is unauthenticated on purpose —
      # putting the dashboard key in CI just to ping a route is a worse trade
      # than reading 401 for what it is. A 401 means the function ran, reached
      # the guard and refused, which is exactly healthy. A 503 means STATS_KEY
      # is missing on the deployment, and a 5xx means the route is broken, so
      # both still fail the check.
      # The asymmetry is the design post-2026-09-20: /api/s24-public is
      # deliberately public (coarse, PII-free status for /s24 visitors), while
      # this 401 on /api/jp-devices is the key-gate working — full data stays
      # authenticated.
      - name: Test Devices API
        run: |
          RESPONSE=$(curl -sL -o /dev/null -w "%{http_code}" https://jaytipargal.tech/api/jp-devices)
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 401 ]; then
            echo "✅ Devices API OK (HTTP $RESPONSE)"
          else
            echo "❌ Devices API failed with status $RESPONSE"
            exit 1
          fi

      - name: Test Stats API
        run: |
          RESPONSE=$(curl -sL -o /dev/null -w "%{http_code}" https://jaytipargal.tech/api/jp-stats)
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 401 ]; then
            echo "✅ Stats API OK (HTTP $RESPONSE)"
          else
            echo "❌ Stats API failed with status $RESPONSE"
            exit 1
          fi
      
      # The one authenticated probe. HEALTH_CHECK_KEY can only ask verify-db
      # whether Neon answers with the full schema, so CI proves the database
      # works without holding the dashboard key. A 401 here is a failure.
      - name: Test Database Verification (Neon query)
        env:
          HEALTH_CHECK_KEY: ${{ secrets.HEALTH_CHECK_KEY }}
        run: |
          if [ -z "$HEALTH_CHECK_KEY" ]; then
            echo "❌ The HEALTH_CHECK_KEY secret is not set"
            exit 1
          fi
          BODY=$(curl -sS -H "x-health-key: $HEALTH_CHECK_KEY" -w '\n%{http_code}' https://jaytipargal.tech/api/verify-db)
          CODE=$(echo "$BODY" | tail -n 1)
          JSON=$(echo "$BODY" | sed '$d')
          if [ "$CODE" -eq 200 ] && echo "$JSON" | jq -e '.postgres.ok == true' >/dev/null; then
            echo "✅ Neon answered with the full schema ($(echo "$JSON" | jq -r '.postgres.tables_present') tables)"
            echo "   newest event: $(echo "$JSON" | jq -r '.postgres.newest_event_at // "n/a"' | cat)"
            echo "   birthday active_now (last 120s): $(echo "$JSON" | jq -r '.postgres.birthday_active_now // "n/a"' | cat)"

            # Row counts and write freshness are NOT available here, by design.
            #
            # A previous version of this step tried to print
            # .postgres.events / .newest_event_at / .last_write_at. They are
            # always absent for this caller: Backend/verify-db.js:217-222 gives
            # the HEALTH_CHECK_KEY a deliberately narrowed projection --
            # {ok, tables_present, tables_expected} and nothing else -- so that
            # the dashboard key never has to live in CI. The narrowing is pinned
            # by _shared/tests/verify-db-health-key.test.mjs.
            #
            # The result was a log line reading "rows in events: n/a" and a
            # ::warning:: claiming the warehouse had never been written, on every
            # single run. A permanently-on false alarm is worse than no signal,
            # because it is the one people learn to scroll past.
            #
            # If freshness in CI is genuinely wanted, the change is to widen that
            # projection on purpose and update its test -- a decision about what
            # a narrow credential may read, not a tweak to this echo.
            # Until then, check-stale.js is what watches ingestion, and
            # /api/verify-db with the dashboard key is what reports counts.
          else
            echo "❌ Database verification failed (HTTP $CODE): $JSON"
            exit 1
          fi

      # The outside witness for the Product engineering panel.
      #
      # /api/stack-cron already runs every 5 min on Vercel's scheduler, so this
      # is not about detection speed. It is about who notices when the SCHEDULER
      # stops: a Vercel cron cannot report its own absence, and the panel would
      # sit there showing a cheerful last-known-good from hours ago. This job
      # runs on GitHub's infrastructure, so it survives that failure
      # independently — the whole point of two schedules in two places.
      #
      # It READS the native receipt the scheduler writes. It never calls
      # /api/stack-cron: invoking the route here would update the receipt and
      # the monitor would then be proving its own liveness instead of the
      # scheduler's.
      #
      # Uses the same narrow HEALTH_CHECK_KEY projection as verify-db above:
      # a verdict and counts, never file paths or problem strings, because those
      # name internal hosts and env vars. 503 means something is genuinely
      # failing; 401 here is a failure, not a healthy refusal, because this
      # credential is supposed to work.
      - name: Test Stack Health (Product engineering probes)
        id: stack
        env:
          HEALTH_CHECK_KEY: ${{ secrets.HEALTH_CHECK_KEY }}
        run: |
          if [ -z "$HEALTH_CHECK_KEY" ]; then
            echo "❌ The HEALTH_CHECK_KEY secret is not set"
            exit 1
          fi
          BODY=$(curl -sS -H "x-health-key: $HEALTH_CHECK_KEY" -w '\n%{http_code}' https://jaytipargal.tech/api/jp-stack)
          CODE=$(echo "$BODY" | tail -n 1)
          JSON=$(echo "$BODY" | sed '$d')
          OVERALL=$(echo "$JSON" | jq -r '.overall // "unreadable"')
          CLOUDFAIL=$(echo "$JSON" | jq -r '.cloud_fail // "unreadable"')
          ALLFAIL=$(echo "$JSON" | jq -r '.summary.fail // 0')
          VERDICT=$(echo "$JSON" | jq -r '.readiness.verdict // "absent"')
          READY=$(echo "$JSON" | jq -r '.readiness.ready // false')
          if { [ "$CODE" = "200" ] || [ "$CODE" = "503" ]; } \
             && echo "$JSON" | jq -e '(.overall == "ok" or .overall == "warn" or .overall == "fail" or .overall == "unknown") and (.cloud_fail | type == "number") and (.summary.ok | type == "number") and (.summary.fail | type == "number")' >/dev/null; then
            if [ "$VERDICT" = "absent" ]; then
              # The deployed /api/jp-stack predates the strict readiness
              # contract, so this monitor cannot tell a proven pass from a
              # hopeful one. Saying "unknown" is the honest answer; exiting 0
              # would be the green light the whole change exists to remove.
              echo "❌ The stack endpoint exposes no strict readiness verdict — the health contract is out of date"
              echo "   $JSON"
              echo "status=unverifiable" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            if [ "$CODE" = "200" ] && [ "$OVERALL" = "ok" ] && [ "$READY" = "true" ]; then
              echo "✅ Stack endpoint OK (overall=$OVERALL, verdict=$VERDICT, $(echo "$JSON" | jq -r '.summary.ok') checks ok)"
              echo "status=ok" >> "$GITHUB_OUTPUT"
            elif [ "$CLOUDFAIL" = "0" ] && [ "$CODE" = "200" ]; then
              echo "⚠️ Cloud probes all green; $((ALLFAIL)) red file(s) are device freshness only"
              echo "   $JSON"
              echo "status=device_freshness" >> "$GITHUB_OUTPUT"
              echo "device_freshness_red=$ALLFAIL" >> "$GITHUB_OUTPUT"
            elif [ "$CLOUDFAIL" = "0" ]; then
              # Red, but every red file belongs to the device probe: a stopped
              # daemon that no deploy can fix. It stays visible and blocks the
              # strict release gate, without turning every pull request red.
              echo "⚠️ Cloud probes all green; $((ALLFAIL)) red file(s) are device freshness only"
              echo "   $JSON"
              echo "status=device_freshness" >> "$GITHUB_OUTPUT"
              echo "device_freshness_red=$ALLFAIL" >> "$GITHUB_OUTPUT"
            elif [ "$VERDICT" = "unproven" ]; then
              echo "❌ Required evidence is missing: $((ALLFAIL)) failing and the rest cannot be proven"
              echo "   $JSON"
              echo "status=unproven" >> "$GITHUB_OUTPUT"
              exit 1
            else
              echo "❌ Downstream probe failures reported (HTTP $CODE, cloud_fail=$CLOUDFAIL, verdict=$VERDICT)"
              echo "   $JSON"
              echo "status=stack_degraded" >> "$GITHUB_OUTPUT"
              echo "stack_cloud_fail=$CLOUDFAIL" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            echo "❌ Stack endpoint failed or returned an invalid health payload (HTTP $CODE): $JSON"
            exit 1
          fi

      # The missed-run detector.
      #
      # The panel's own "unattended check last ran N min ago" line is drawn in
      # a browser, and a browser is exactly what is not there at 03:00. This
      # step reads the same native receipt from outside, and fails when the
      # scheduler has stopped — the one failure the Vercel cron cannot report
      # about itself.
      #
      # The age comes from the server, which judges the NATIVE receipt only. A
      # manual run cannot refresh it, so pressing "check now" in the dashboard
      # cannot hide a dead schedule.
      - name: Detect a missed scheduled run
        id: schedule
        env:
          HEALTH_CHECK_KEY: ${{ secrets.HEALTH_CHECK_KEY }}
        run: |
          if [ -z "$HEALTH_CHECK_KEY" ]; then
            echo "❌ The HEALTH_CHECK_KEY secret is not set"
            exit 1
          fi
          BODY=$(curl -sS -H "x-health-key: $HEALTH_CHECK_KEY" -w '\n%{http_code}' https://jaytipargal.tech/api/jp-stack)
          CODE=$(echo "$BODY" | tail -n 1)
          JSON=$(echo "$BODY" | sed '$d')
          if [ "$CODE" != "200" ] && [ "$CODE" != "503" ]; then
            echo "❌ Could not read the schedule (HTTP $CODE)"
            exit 1
          fi
          PRESENT=$(echo "$JSON" | jq -r '.schedule.present // false')
          STALE=$(echo "$JSON" | jq -r '.schedule.stale // true')
          AGE=$(echo "$JSON" | jq -r '.schedule.age_minutes // "unknown"')
          MAXAGE=$(echo "$JSON" | jq -r '.schedule.max_age_minutes // 20')
          if [ "$PRESENT" != "true" ]; then
            echo "❌ No unattended run has ever been recorded — the 5-minute scheduler has never run"
            echo "status=missing" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$STALE" = "true" ]; then
            echo "❌ The unattended scheduler has not run for $AGE min (max $MAXAGE min) — the schedule is stopped"
            echo "status=stale" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "✅ Unattended scheduler ran $AGE min ago (max $MAXAGE min)"
          echo "status=ok" >> "$GITHUB_OUTPUT"

      - name: Report Status
        env:
          STACK_STATUS: ${{ steps.stack.outputs.status }}
          STACK_REDS: ${{ steps.stack.outputs.device_freshness_red }}
          STACK_CLOUD_FAIL: ${{ steps.stack.outputs.stack_cloud_fail }}
          SCHEDULE_STATUS: ${{ steps.schedule.outputs.status }}
        run: |
          # Only the stack probe can succeed with a caveat, so it is the only row
          # that is not a hardcoded OK: every earlier step exits 1 on failure and
          # therefore skips this one. Claiming "All Endpoints Healthy" while the
          # stack probe warned about stale devices is a false all-clear -- the same
          # permanently-wrong-signal failure this workflow's own comments warn
          # against, inverted.
          case "$STACK_STATUS" in
            ok)
              heading="## ✅ All Endpoints Healthy"
              stack_row="✅ OK"
              ;;
            device_freshness)
              heading="## ⚠️ Cloud Endpoints Healthy — Devices Stale"
              # STACK_REDS counts stack-map FILES bound to the devices probe (six
              # of them), not devices; there are three devices. "6
              # device-freshness red(s)" was read as six stale devices once.
              stack_row="⚠️ ${STACK_REDS:-?} red file(s) on the device-freshness probe (files, not devices); cloud probes green, the strict release gate does not pass"
              ;;
            stack_degraded)
              heading="## ⚠️ Stack Endpoint Reachable — Downstream Probes Degraded"
              stack_row="⚠️ ${STACK_CLOUD_FAIL:-?} cloud probe failure(s); endpoint responded with a valid health payload"
              ;;
            unproven)
              heading="## ⚠️ Stack Endpoint Reachable — Required Evidence Missing"
              stack_row="⚠️ required rows have no usable evidence; the release gate stays closed"
              ;;
            *)
              heading="## ❓ Stack Probe Recorded No Status"
              stack_row="❓ no status recorded — treat as unknown, not healthy"
              ;;
          esac
          case "$SCHEDULE_STATUS" in
            ok)
              schedule_row="✅ OK (ran recently)"
              ;;
            stale)
              schedule_row="❌ the 5-minute scheduler looks stopped"
              ;;
            missing)
              schedule_row="❌ no unattended run has ever been recorded"
              ;;
            *)
              schedule_row="❓ unknown"
              ;;
          esac
          {
            echo "$heading"
            echo ""
            echo "| Endpoint | Status |"
            echo "|----------|--------|"
            echo "| Homepage | ✅ OK |"
            echo "| Devices API | ✅ OK |"
            echo "| Stats API | ✅ OK |"
            echo "| Database (Neon query) | ✅ OK |"
            echo "| Stack health | $stack_row |"
            echo "| Unattended schedule | $schedule_row |"
          } >> "$GITHUB_STEP_SUMMARY"
