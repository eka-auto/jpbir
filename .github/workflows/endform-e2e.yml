name: Run end-to-end tests with Endform

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write # required for authentication with Endform

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      # Your usual setup steps, adjust them to match your project
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: true

      - name: Wait for Vercel deployment
        uses: endformdev/actions/run-with-vercel-deployment@main
        with:
          project-name: your-vercel-project-name
          set-url-env-var: BASE_URL # Export the deployment URL for your playwright.config.ts to pick up

      - name: Run end-to-end tests with Endform
        run: npx endform@latest test
