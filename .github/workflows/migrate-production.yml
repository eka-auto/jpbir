name: Apply Pending Migrations

# Applies this repository's pending migrations to the PRODUCTION warehouse.
#
# The repository had no way to do this. Database/scripts/migrate.mjs is a CLI
# script, and the credential it needs lives in Vercel, so a migration could
# only be applied by a person who had pulled the production environment onto
# a laptop. That is how a schema change reaches production by hand, and it is
# not something to keep doing.
#
# Two gates before anything is written:
#
#   1. The target's identity is printed and compared with the production
#      deployment's own view of the same rows. The DATABASE_URL secret and the
#      deployed application must be reading the SAME database, or the
#      comparison fails and the job stops. This is the check that makes the
#      job safe to point at production: a migration applied to the wrong
#      database is worse than no migration.
#
#   2. The migration runner applies ONLY the files this repository owns that
#      the shared ledger does not yet record. It never touches a file another
#      repository owns.
#
# The shared ledger is written by two repositories, so "pending" is decided
# with the alias map, not by a filename prefix.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type the Neon project id to confirm the target (see project/targets.json)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    name: Apply pending migrations to the production warehouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The credential never appears in the command line, the log, or the
      # process list: it is passed to the container by NAME.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      STATS_KEY: ${{ secrets.STATS_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The target's identity, and proof that it is the database the deployed
      # application reads. One script, shared with the dry-run workflow, so the
      # two cannot drift apart: the credential must resolve to the project,
      # branch and database project/targets.json records, and to a database the
      # deployed application still writes to.
      - name: Verify the target is the production warehouse
        run: node .github/scripts/verify-production-warehouse.mjs

      - name: Apply the pending migrations in the project environment
        run: |
          set -euo pipefail
          docker compose -f project/environment/compose.yaml build dev
          docker compose -f project/environment/compose.yaml run --rm \
            -e DATABASE_URL -e DATABASE_URL_UNPOOLED \
            dev node Database/scripts/migrate.mjs

      - name: Report what the warehouse holds now
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import pg from 'pg';
          const c = new pg.Client({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: true } });
          await c.connect();
          const bySite = await c.query('select site, count(*)::int n from events group by site order by n desc');
          const tables = await c.query('select table_name from information_schema.tables where table_schema = $1 order by table_name', ['public']);
          const ledger = await c.query('select filename from schema_migrations order by filename');
          await c.end();
          console.log('events by site:');
          for (const row of bySite.rows) console.log('  ' + row.site + ': ' + row.n);
          console.log('tables: ' + tables.rows.length);
          console.log('ledger entries: ' + ledger.rows.length);
          for (const row of ledger.rows) console.log('  ' + row.filename);
          EOF
