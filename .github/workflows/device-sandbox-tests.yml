name: Device Sandbox Tests

# The channel-sandbox suite validates the device-agent stack that ships to the
# physical fleet: broker client, signer, enrollment minting, and — critically —
# that every device kit (S24, Lenovo, Vivobook) bundles a byte-identical copy of
# the canonical agent (tests/test_deploy_kits.py). That drift check runs on no
# other workflow, so a kit falling out of sync with Devices/sandbox reaches a
# device unnoticed. It also starts an isolated Firestore emulator and drives
# the dashboard -> queue -> device-agent completion path end to end.

on:
  push:
    branches: [main]
    paths:
      - 'Devices/**'
      - '.github/workflows/device-sandbox-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Devices/**'
      - '.github/workflows/device-sandbox-tests.yml'

jobs:
  sandbox-tests:
    name: channel-sandbox suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Read the same pin the Vercel @vercel/python builder reads, so this
          # suite can never again validate on an interpreter production does not
          # run. It was hardcoded '3.14' while channel-sandbox deployed on 3.12
          # - the builder's DEFAULT_PYTHON_VERSION, because nothing under
          # Devices/sandbox named a version. requirements.txt pins the five
          # libraries but not the interpreter, so a 3.13/3.14-only feature would
          # have passed here and broken the deployed lambda.
          python-version-file: Devices/sandbox/.python-version

      - name: Install dependencies
        working-directory: Devices/sandbox
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-broker.txt pytest

      - name: Run channel-sandbox tests
        working-directory: Devices/sandbox
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -q

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Run dashboard and agent emulator E2E
        working-directory: Devices/sandbox
        run: >-
          npx --yes firebase-tools@15.30.2 emulators:exec
          --config firebase.json
          --project intrepid-stage-495117-q1
          --only firestore
          "python e2e_engineering_sandbox_test.py"
