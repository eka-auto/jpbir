name: Diagnose Neon Access

# A read-only look at what the Neon API key can do.
#
# The purge job needs to execute SQL on the branch the deployed application
# reads. Listing branches works; executing SQL does not, and the difference
# matters: a key without the SQL scope cannot delete anything, and a key
# without it can. This prints what the key can reach so the next step is
# chosen from evidence rather than from another guess.

on:
  push:
    branches:
      - chore/birthday-only-analytics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: What can the Neon key reach
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Look
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          const API = 'https://console.neon.tech/api/v2';
          const headers = { Authorization: 'Bearer ' + process.env.NEON_API_KEY, 'Content-Type': 'application/json' };
          const show = async (label, url, init) => {
            const r = await fetch(url, { headers, ...init });
            const text = await r.text();
            console.log('--- ' + label + ' -> HTTP ' + r.status);
            console.log(text.slice(0, 1200));
            return { status: r.status, text };
          };
          const projectId = 'fancy-cloud-99501540';
          await show('project', API + '/projects/' + projectId);
          await show('branches', API + '/projects/' + projectId + '/branches');
          await show('roles', API + '/projects/' + projectId + '/roles');
          await show('query on the first branch', API + '/projects/' + projectId + '/databases/neondb/query?branch=br-spring-pine-au5jtfig', {
            method: 'POST', body: JSON.stringify({ query: 'select 1 as one' }),
          });
          await show('connection uri', API + '/projects/' + projectId + '/connection_uri?branch=br-spring-pine-au5jtfig&database_name=neondb');
          EOF
