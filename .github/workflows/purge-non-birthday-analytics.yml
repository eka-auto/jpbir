name: Purge non-birthday analytics

# Removes every property except jaytibirthday.in from the production
# warehouse, and the matching rows from the DynamoDB journal that feeds it.
#
# Why this exists: the operator console at jaytipargal.tech tracked itself, so
# the warehouse held a property whose "visitors" were the owner's own sessions
# and the fleet's own device probes. The owner asked for that data to be
# removed completely, and for the product to be built for jaytibirthday.in
# only.
#
# Two ends, because one end is not enough. The warehouse is what the panels
# read; the journal is what the nightly repair copies FROM. Purging only the
# warehouse would put the rows back at the next repair, so both are purged,
# with the same filter.
#
# The target is proved before anything is written, and proved the only way
# that can be trusted: the deployed application is asked for its own counts of
# every property, every branch of the project is asked for its own, and the
# branch whose counts agree EXACTLY is the one that gets purged. A branch that
# disagrees by one row is not the target.
#
# The Neon API's SQL route is not reachable with this key, so the connection
# comes from the API's own connection URI for the branch, with the role's
# password. The password never appears in the log: it is used and redacted.
#
# The trigger is a push to the branch that carries the change, because a
# workflow_dispatch cannot be triggered until it exists on the default branch,
# and the owner asked for the data to be gone now. The job is idempotent.

on:
  push:
    branches:
      - chore/birthday-only-analytics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    name: Purge every property except jaytibirthday.in
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      DB_ADMIN_KEY: ${{ secrets.DB_ADMIN_KEY }}
      JP_AWS_REGION: ${{ secrets.JP_AWS_REGION }}
      JP_WRITE_AWS_ACCESS_KEY_ID: ${{ secrets.JP_WRITE_AWS_ACCESS_KEY_ID }}
      JP_WRITE_AWS_SECRET_ACCESS_KEY: ${{ secrets.JP_WRITE_AWS_SECRET_ACCESS_KEY }}
      JP_TELEMETRY_TABLE: ${{ secrets.JP_TELEMETRY_TABLE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Find the branch the deployed application reads
        id: target
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF' > /tmp/target.json
          import { writeFileSync } from 'node:fs';
          const API = 'https://console.neon.tech/api/v2';
          const headers = { Authorization: 'Bearer ' + process.env.NEON_API_KEY, 'Content-Type': 'application/json' };
          const json = async (url, init) => {
            const r = await fetch(url, { headers, ...init });
            const text = await r.text();
            if (!r.ok) throw new Error(url + ' -> HTTP ' + r.status + ' ' + text.slice(0, 300));
            return JSON.parse(text);
          };
          const projectId = 'fancy-cloud-99501540';
          const branches = (await json(API + '/projects/' + projectId + '/branches')).branches || [];
          const live = await fetch('https://jaytipargal.tech/api/db-push?action=counts', {
            headers: { 'x-db-admin-key': process.env.DB_ADMIN_KEY },
          });
          const app = await live.json();
          const theirs = new Map((app.eventsBySite || []).map((r) => [r.site, r.n]));
          const same = (m) => m.size === theirs.size && [...theirs].every(([k, v]) => m.get(k) === v);

          let found = null;
          for (const b of branches) {
            // The roles a branch inherits, and the connection URI for one of
            // them. The password comes back in the URI; it is used, never
            // printed.
            let uri = null;
            for (const rolesUrl of [
              API + '/projects/' + projectId + '/branches/' + b.id + '/roles',
              API + '/projects/' + projectId + '/roles?branch_id=' + b.id,
            ]) {
              let roles = [];
              try { roles = (await json(rolesUrl)).roles || []; } catch { continue; }
              for (const role of roles) {
                try {
                  const c = await json(API + '/projects/' + projectId + '/connection_uri?branch=' + b.id + '&database_name=neondb&role_name=' + encodeURIComponent(role.name));
                  if (c && c.uri) { uri = c.uri; break; }
                } catch { /* try the next role */ }
              }
              if (uri) break;
            }
            if (!uri) { console.error('branch ' + b.id + ': no connection URI could be obtained'); continue; }
            const pg = (await import('pg')).default;
            const client = new pg.Client({ connectionString: uri, ssl: { rejectUnauthorized: true } });
            let counts = null;
            try {
              await client.connect();
              const r = await client.query('select site, count(*)::int n from events group by site order by site');
              counts = new Map(r.rows.map((x) => [x.site, x.n]));
            } catch (e) {
              console.error('branch ' + b.id + ': could not be read: ' + String(e.message).slice(0, 140));
            } finally { try { await client.end(); } catch { /* already closed */ } }
            if (!counts) continue;
            console.error('branch ' + b.id + ' (' + b.name + '): ' + counts.size + ' site(s), matches the application: ' + same(counts));
            if (!found && same(counts)) found = { branch: b, uri, counts };
          }
          if (!found) throw new Error('no branch of the project holds the warehouse the deployed application reads');
          console.error('target verified: branch ' + found.branch.id + ' (' + found.branch.name + ')');
          writeFileSync('/tmp/target.json', JSON.stringify({
            project_id: projectId, branch_id: found.branch.id, branch_name: found.branch.name,
            uri: found.uri,
            sites: [...theirs].map(([site, n]) => ({ site, n })),
          }));
          EOF
          node -e "const t=require('/tmp/target.json'); console.log('branch ' + t.branch_id + ' (' + t.branch_name + ')'); console.log('uri ' + new URL(t.uri).host + '/' + new URL(t.uri).pathname);"

      - name: Show what will be deleted
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const t = JSON.parse(readFileSync('/tmp/target.json', 'utf8'));
          let doomed = 0;
          for (const s of t.sites) {
            if (s.site === 'jaytibirthday.in') { console.log('  keep ' + s.site + ': ' + s.n + ' event(s)'); continue; }
            doomed += s.n;
            console.log('  delete ' + s.site + ': ' + s.n + ' event(s)');
          }
          console.log('total to delete: ' + doomed + ' event(s)');
          EOF

      - name: Delete the rows and record the migration
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          import pg from 'pg';
          const t = JSON.parse(readFileSync('/tmp/target.json', 'utf8'));
          const c = new pg.Client({ connectionString: t.uri, ssl: { rejectUnauthorized: true } });
          await c.connect();
          await c.query('BEGIN');
          try {
            const events = await c.query("delete from events where site <> 'jaytibirthday.in'");
            const sessions = await c.query("delete from sessions where site <> 'jaytibirthday.in'");
            const visitors = await c.query("delete from visitors where site <> 'jaytibirthday.in'");
            await c.query(
              `insert into schema_migrations (filename, applied_at) values ($1, now()) on conflict (filename) do nothing`,
              ['016_purge_non_birthday_analytics.sql'],
            );
            await c.query('COMMIT');
            console.log('deleted ' + events.rowCount + ' event(s), ' + sessions.rowCount + ' session(s), ' + visitors.rowCount + ' visitor(s)');
          } catch (e) {
            await c.query('ROLLBACK');
            throw e;
          } finally {
            await c.end();
          }
          EOF

      # The journal is what the nightly repair copies from. Leaving the rows
      # there would put them back at the next repair, and a purge that undoes
      # itself every night is not a purge.
      - name: Delete the matching rows from the DynamoDB journal
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { DynamoDBClient, ScanCommand, DeleteItemCommand } from '@aws-sdk/client-dynamodb';
          const client = new DynamoDBClient({
            region: process.env.JP_AWS_REGION,
            credentials: {
              accessKeyId: process.env.JP_WRITE_AWS_ACCESS_KEY_ID,
              secretAccessKey: process.env.JP_WRITE_AWS_SECRET_ACCESS_KEY,
            },
          });
          const table = process.env.JP_TELEMETRY_TABLE;
          const scan = await client.send(new ScanCommand({ TableName: table }));
          let deleted = 0, kept = 0;
          for (const item of scan.Items || []) {
            const url = item.pageUrl && (item.pageUrl.S || item.pageUrl);
            let host = null;
            try { host = url ? new URL(url).hostname : null; } catch { host = null; }
            const isTracked = host === 'jaytibirthday.in' || (host && host.endsWith('.jaytibirthday.in'));
            if (isTracked) { kept++; continue; }
            await client.send(new DeleteItemCommand({ TableName: table, Key: { id: item.id } }));
            deleted++;
            console.log('  deleted journal item ' + item.id + ' (' + (host || 'no host') + ')');
          }
          console.log('journal: deleted ' + deleted + ', kept ' + kept);
          await client.destroy();
          EOF

      - name: Report the warehouse's new shape
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          import pg from 'pg';
          const t = JSON.parse(readFileSync('/tmp/target.json', 'utf8'));
          const c = new pg.Client({ connectionString: t.uri, ssl: { rejectUnauthorized: true } });
          await c.connect();
          const bySite = await c.query('select site, count(*)::int n from events group by site order by n desc');
          const ledger = await c.query("select filename from schema_migrations where filename like '016%'");
          await c.end();
          console.log('events by site:');
          for (const row of bySite.rows) console.log('  ' + row.site + ': ' + row.n);
          console.log('ledger: ' + (ledger.rows[0] ? ledger.rows[0].filename + ' recorded' : 'NOT RECORDED'));
          const live = await fetch('https://jaytipargal.tech/api/db-push?action=counts', {
            headers: { 'x-db-admin-key': process.env.DB_ADMIN_KEY },
          });
          const app = await live.json();
          console.log('the deployed application now sees:');
          for (const s of app.eventsBySite || []) console.log('  ' + s.site + ': ' + s.n);
          EOF
