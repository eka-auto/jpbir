# Root tooling config. The personal_folder_agent package was removed;
# this now only configures test/lint tooling for the remaining Sandbox tests.

[tool.pytest.ini_options]
testpaths = ["Sandbox/Configuration/tests"]
addopts = ""

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
