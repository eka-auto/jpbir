name: Sync keys to jpbir production

# Configure a key in GitHub and Vercel production, then redeploy:
#   gh secret set NAME -R eka-auto/jpbir
#   gh workflow run sync-keys-to-vercel.yml -R eka-auto/jpbir
# Also rebuilds production after a manual `vercel env add`. Rules: .github/scripts/sync-keys-to-vercel.mjs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would change without writing
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-keys-to-vercel.yml
      - .github/scripts/sync-keys-to-vercel.mjs

permissions:
  contents: read

concurrency:
  group: sync-keys-to-vercel
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts

      - name: Add missing keys to jpbir production
        run: node .github/scripts/sync-keys-to-vercel.mjs
        env:
          # Pushes only report; a dispatch writes unless dry_run is ticked.
          DRY_RUN: ${{ (github.event_name != 'workflow_dispatch' || inputs.dry_run) && '1' || '' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_gcqCiU4UgkhcUJGRGLZYaQiW
          VERCEL_PROJECT_ID: prj_47peuCvcDnURmUqhU3aFlaBP351J
          # One explicit reference per synced key. Never ${{ toJSON(secrets) }}:
          # that hands the runner the whole secret store at once and trips
          # GitHub's malicious-workflow gate, forcing manual approval per run.
          SYNC_SECRET_AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          SYNC_SECRET_AGENT_API_URL: ${{ secrets.AGENT_API_URL }}
          SYNC_SECRET_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SYNC_SECRET_BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          SYNC_SECRET_CONNECT_CLIENT_ID: ${{ secrets.CONNECT_CLIENT_ID }}
          SYNC_SECRET_CONNECT_CONNECTOR_UID: ${{ secrets.CONNECT_CONNECTOR_UID }}
          SYNC_SECRET_CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SYNC_SECRET_DB_ADMIN_KEY: ${{ secrets.DB_ADMIN_KEY }}
          SYNC_SECRET_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SYNC_SECRET_FIRESTORE_DB: ${{ secrets.FIRESTORE_DB }}
          SYNC_SECRET_HEALTH_CHECK_KEY: ${{ secrets.HEALTH_CHECK_KEY }}
          SYNC_SECRET_JP_AWS_ACCESS_KEY_ID: ${{ secrets.JP_AWS_ACCESS_KEY_ID }}
          SYNC_SECRET_JP_AWS_SECRET_ACCESS_KEY: ${{ secrets.JP_AWS_SECRET_ACCESS_KEY }}
          SYNC_SECRET_JP_WRITE_AWS_ACCESS_KEY_ID: ${{ secrets.JP_WRITE_AWS_ACCESS_KEY_ID }}
          SYNC_SECRET_JP_WRITE_AWS_SECRET_ACCESS_KEY: ${{ secrets.JP_WRITE_AWS_SECRET_ACCESS_KEY }}
          SYNC_SECRET_S24_SYNC_PUBLIC_KEYS: ${{ secrets.S24_SYNC_PUBLIC_KEYS }}
          SYNC_SECRET_S24_SYNC_PRIVATE_KEY_PEM: ${{ secrets.S24_SYNC_PRIVATE_KEY_PEM }}
          SYNC_SECRET_STALE_ALERT_SECONDS: ${{ secrets.STALE_ALERT_SECONDS }}
          SYNC_SECRET_STATS_KEY: ${{ secrets.STATS_KEY }}
          SYNC_SECRET_STATS_SITE: ${{ secrets.STATS_SITE }}
          SYNC_SECRET_VERCEL_ANALYTICS_PROJECT_ID: ${{ secrets.VERCEL_ANALYTICS_PROJECT_ID }}
          SYNC_SECRET_VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          SYNC_SECRET_VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          SYNC_SECRET_WA_INGEST_KEY: ${{ secrets.WA_INGEST_KEY }}
          # Every key the deployed code (Backend/, Integrations/) reads, except
          # database URLs (jpbir_live production DB is pinned outside CI to keep
          # the readable recovered chats intact).
          #
          # JP_AWS_* / JP_WRITE_AWS_* are here because Backend/db-push.js reads
          # them: the nightly DynamoDB -> Neon warehouse repair cannot start
          # without the read pair, and it answered 503 "JP_AWS_* read credentials
          # not configured" on 2026-10-14 with no light on any panel (the 2026-10-10
          # environment re-provision carried the region and table name across but
          # not the credentials). Add-only, so a dispatch creates exactly the ones
          # missing from Production and nothing else. See
          # project/reports/2026-10-15-live-data-diagnosis.md (P4, Q2, Q3).
          SYNC_KEYS: >-
            AGENT_API_KEY AGENT_API_URL ANTHROPIC_API_KEY BLOB_READ_WRITE_TOKEN
            CONNECT_CLIENT_ID CONNECT_CONNECTOR_UID CRON_SECRET
            DB_ADMIN_KEY FIREBASE_SERVICE_ACCOUNT_JSON FIRESTORE_DB
            HEALTH_CHECK_KEY
            JP_AWS_ACCESS_KEY_ID JP_AWS_SECRET_ACCESS_KEY
            JP_WRITE_AWS_ACCESS_KEY_ID JP_WRITE_AWS_SECRET_ACCESS_KEY
            S24_SYNC_PUBLIC_KEYS STALE_ALERT_SECONDS STATS_KEY STATS_SITE
            VERCEL_ANALYTICS_PROJECT_ID VERCEL_API_TOKEN VERCEL_TEAM_ID WA_INGEST_KEY
