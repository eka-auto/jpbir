# jpbir project environment (contract rule 3; decision D-8).
#
# `project/environment/run` is the only entry point: it runs
# `docker compose -f compose.yaml run --rm dev <command>`. The `dev` service is
# built from ./Dockerfile with the repository mounted; `db` is the pinned
# backing service the migrations and database tests need.
services:
  dev:
    build:
      context: ../..
      dockerfile: project/environment/Dockerfile
    image: jpbir-dev
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://jpbir:jpbir@db:5432/jpbir
      # Git inside the container reads the bind mount. On a Linux runner that
      # mount is owned by the runner's uid while the container runs as root,
      # and git refuses the combination as "dubious ownership" and exits 1 —
      # which broke the two suites that read the tracked file list
      # (dependency-hygiene, deploy-manifest). Declaring the directory safe
      # is git's own documented way of saying "this mount is expected"; it
      # grants nothing beyond reading the repository that is already mounted.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /workspace
    depends_on:
      db:
        condition: service_healthy
    init: true

  db:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_USER: jpbir
      POSTGRES_PASSWORD: jpbir
      POSTGRES_DB: jpbir
    volumes:
      - jpbir-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jpbir -d jpbir"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  jpbir-postgres:
