name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test (Python + Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Sandbox/Configuration/requirements.txt
          pip install pytest pytest-cov pytest-mock hypothesis tiktoken pyyaml
          pip install pdfplumber python-docx openpyxl python-pptx pandas pillow lxml charset-normalizer

      - name: Test Sandbox
        run: python -m pytest Sandbox/Configuration/tests -q -o addopts=""

      - name: Test personal_folder_agent
        run: python -m pytest personal_folder_agent/tests -q -o addopts=""

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: Dashboard/Current

      - name: Test Dashboard
        run: |
          node others/test/stale.test.mjs
          node others/test/broker.test.mjs
          node others/test/connect.test.mjs
        working-directory: Dashboard/Current
