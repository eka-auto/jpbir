name: Endpoint Health Check

on:
  deployment_status:
  schedule:
    - cron: '*/15 * * * *'  # Run every 15 minutes
  workflow_dispatch:

jobs:
  health-check:
    name: Check Endpoint Health
    runs-on: ubuntu-latest
    if: github.event.deployment_status.state == 'success' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      
      - name: Wait for deployment (if triggered by deployment)
        if: github.event_name == 'deployment_status'
        run: sleep 30
        shell: bash
      
      - name: Test Homepage
        run: |
          RESPONSE=$(curl -sL -o /dev/null -w "%{http_code}" https://jaytipargal.tech/)
          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ Homepage OK"
          else
            echo "❌ Homepage failed with status $RESPONSE"
            exit 1
          fi
      
      # These API probes are key-gated, and this probe is unauthenticated on purpose —
      # putting the dashboard key in CI just to ping a route is a worse trade
      # than reading 401 for what it is. A 401 means the function ran, reached
      # the guard and refused, which is exactly healthy. A 503 means STATS_KEY
      # is missing on the deployment, and a 5xx means the route is broken, so
      # both still fail the check.
      # The asymmetry is the design post-2026-09-20: /api/s24-public is
      # deliberately public (coarse, PII-free status for /s24 visitors), while
      # this 401 on /api/jp-devices is the key-gate working — full data stays
      # authenticated.
      - name: Test Devices API
        run: |
          RESPONSE=$(curl -sL -o /dev/null -w "%{http_code}" https://jaytipargal.tech/api/jp-devices)
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 401 ]; then
            echo "✅ Devices API OK (HTTP $RESPONSE)"
          else
            echo "❌ Devices API failed with status $RESPONSE"
            exit 1
          fi

      - name: Test Stats API
        run: |
          RESPONSE=$(curl -sL -o /dev/null -w "%{http_code}" https://jaytipargal.tech/api/jp-stats)
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 401 ]; then
            echo "✅ Stats API OK (HTTP $RESPONSE)"
          else
            echo "❌ Stats API failed with status $RESPONSE"
            exit 1
          fi
      
      # The one authenticated probe. HEALTH_CHECK_KEY can only ask verify-db
      # whether Neon answers with the full schema, so CI proves the database
      # works without holding the dashboard key. A 401 here is a failure.
      - name: Test Database Verification (Neon query)
        env:
          HEALTH_CHECK_KEY: ${{ secrets.HEALTH_CHECK_KEY }}
        run: |
          if [ -z "$HEALTH_CHECK_KEY" ]; then
            echo "❌ The HEALTH_CHECK_KEY secret is not set"
            exit 1
          fi
          BODY=$(curl -sS -H "x-health-key: $HEALTH_CHECK_KEY" -w '\n%{http_code}' https://jaytipargal.tech/api/verify-db)
          CODE=$(echo "$BODY" | tail -n 1)
          JSON=$(echo "$BODY" | sed '$d')
          if [ "$CODE" -eq 200 ] && echo "$JSON" | jq -e '.postgres.ok == true' >/dev/null; then
            echo "✅ Neon answered with the full schema ($(echo "$JSON" | jq -r '.postgres.tables_present') tables)"

            # Row counts and write freshness are NOT available here, by design.
            #
            # A previous version of this step tried to print
            # .postgres.events / .newest_event_at / .last_write_at. They are
            # always absent for this caller: Backend/verify-db.js:217-222 gives
            # the HEALTH_CHECK_KEY a deliberately narrowed projection --
            # {ok, tables_present, tables_expected} and nothing else -- so that
            # the dashboard key never has to live in CI. The narrowing is pinned
            # by _shared/tests/verify-db-health-key.test.mjs.
            #
            # The result was a log line reading "rows in events: n/a" and a
            # ::warning:: claiming the warehouse had never been written, on every
            # single run. A permanently-on false alarm is worse than no signal,
            # because it is the one people learn to scroll past.
            #
            # If freshness in CI is genuinely wanted, the change is to widen that
            # projection on purpose and update its test -- a decision about what
            # a narrow credential may read, not a tweak to this echo.
            # Until then, check-stale.js is what watches ingestion, and
            # /api/verify-db with the dashboard key is what reports counts.
          else
            echo "❌ Database verification failed (HTTP $CODE): $JSON"
            exit 1
          fi

      - name: Report Status
        run: |
          {
            echo "## ✅ All Endpoints Healthy"
            echo ""
            echo "| Endpoint | Status |"
            echo "|----------|--------|"
            echo "| Homepage | ✅ OK |"
            echo "| Devices API | ✅ OK |"
            echo "| Stats API | ✅ OK |"
            echo "| Database (Neon query) | ✅ OK |"
          } >> "$GITHUB_STEP_SUMMARY"
