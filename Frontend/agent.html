<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E0A08">
<title>Agent — jaytipargal.tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
        --amber: #C87A1E; --amber-glow: #F0B968; --ink: #221A15; --ink-muted: #6C5F53;
        --border: #E8DFD5; --bg: #1C1007; --panel: #FFF8EE; --panel2: #FFFDF9; --bad: #C0392B;
        --serif: 'Fraunces', Georgia, serif; --sans: 'Inter', system-ui, sans-serif;
    }
    html, body { height: 100%; }
    body { font-family: var(--sans); background: var(--bg); color: var(--ink); line-height: 1.6;
        -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
    .skip-link { position: fixed; left: 12px; top: 12px; z-index: 200; transform: translateY(-180%); background: #fff; color: #111; padding: 10px 14px; border-radius: 8px; }
    .skip-link:focus { transform: none; }
    button, textarea, input, a { touch-action: manipulation; }
    button:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--amber-glow); outline-offset: 3px; }

    .topbar { position: sticky; top: env(safe-area-inset-top, 0px); display: flex; align-items: center; gap: 12px;
        padding: 12px 18px; background: rgba(28,16,7,.92); border-bottom: 1px solid rgba(240,185,104,.15); }
    .brand { font-family: var(--serif); font-weight: 700; font-size: 17px; color: #FBF3E9; }
    .brand .dot { color: var(--amber-glow); }
    .spacer { flex: 1; }
    .status { font-size: 12px; color: #D9C9B5; }
    .topbar button { font: inherit; font-size: 12.5px; color: #F4E9DC; background: none; cursor: pointer;
        min-height: 44px; padding: 6px 11px; border: 1px solid rgba(240,185,104,.3); border-radius: 9px; }

    main { flex: 1; width: 100%; max-width: 820px; margin: 0 auto; padding: 18px 16px; display: flex; flex-direction: column; min-height: 0; }
    #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 12px; }
    .empty { color: #CDBBA5; text-align: center; margin: auto; max-width: 440px; }
    .empty h1 { font-family: var(--serif); color: #FBF3E9; font-size: 26px; margin-bottom: 6px; }
    .msg { padding: 11px 14px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; max-width: 92%; }
    .msg.user { align-self: flex-end; background: var(--amber); color: #FFF8EE; }
    .msg.agent { align-self: flex-start; background: var(--panel); }
    .msg.err { align-self: flex-start; background: #F8E3E0; color: var(--bad); }
    .meta { display: block; margin-top: 6px; font-size: 11.5px; color: var(--ink-muted); white-space: normal; }
    .cites { margin: 8px 0 0 18px; font-size: 12px; color: var(--ink-muted); white-space: normal; }
    .cites li { margin: 2px 0; }
    .cites code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--ink); }

    .hub { background: var(--panel); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: 13px; }
    .hub-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .hub-head h2 { font-family: var(--serif); font-size: 15px; font-weight: 600; }
    .hub-head .hint { font-size: 11.5px; color: var(--ink-muted); }
    .hub-head button { font: inherit; font-size: 12px; margin-left: auto; min-height: 44px; padding: 4px 10px; cursor: pointer;
        border: 1px solid var(--border); border-radius: 8px; background: var(--panel2); color: var(--ink); }
    .hub-kpis { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 8px; }
    .hub-kpis b { font-family: var(--serif); font-size: 18px; color: var(--amber); }
    .hub-kpis span { display: block; font-size: 11px; color: var(--ink-muted); }
    .hub-wrap { overflow-x: auto; }
    .hub table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .hub th, .hub td { text-align: left; padding: 4px 6px; border-top: 1px solid var(--border); white-space: nowrap; }
    .hub th { color: var(--ink-muted); font-weight: 500; border-top: 0; }
    .hub th.num, .hub td.num { text-align: right; }
    .hub tr.off td { color: var(--ink-muted); }
    .hub-err { color: var(--bad); font-size: 12.5px; }

    form { display: flex; gap: 8px; padding-bottom: env(safe-area-inset-bottom, 0px); }
    textarea { flex: 1; font: inherit; resize: none; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--border);
        background: var(--panel2); min-height: 48px; max-height: 180px; }
    .opts { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #D9C9B5; margin: 0 0 8px 2px; }
    .send { font: inherit; font-weight: 600; padding: 0 18px; border: 0; border-radius: 12px; background: var(--amber); color: #FFF8EE; cursor: pointer; }
    .send:disabled { opacity: .55; cursor: default; }

    .gate[hidden] { display: none; }
    .gate { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(28,16,7,.96); padding: 16px; }
    .gate-box { background: var(--panel); border-radius: 16px; padding: 28px; max-width: 380px; width: 100%; text-align: center; }
    .gate-box h2 { font-family: var(--serif); margin-bottom: 6px; }
    .gate-box p { font-size: 13px; color: var(--ink-muted); }
    .gate-box input { width: 100%; font: inherit; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px; margin: 14px 0 10px; }
    .gate-box .send { width: 100%; padding: 11px; }
    .gate-err { color: var(--bad); font-size: 12.5px; min-height: 18px; margin-top: 8px; }
</style>
<script src="/section-presentation.js"></script>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to Main Content</a>
<div class="gate" id="gate" hidden>
    <div class="gate-box">
        <h2>Agent</h2>
        <p>Enter the dashboard key to talk to the agent.</p>
        <label for="keyInput">Dashboard key</label>
        <input id="keyInput" name="dashboard-key" type="password" autocomplete="off" spellcheck="false" placeholder="Dashboard key…">
        <button class="send" id="unlockBtn" type="button">Unlock</button>
        <div class="gate-err" id="gateErr" role="status" aria-live="polite"></div>
    </div>
</div>

<header class="topbar">
    <span class="brand">Jayti Agent<span class="dot">.</span></span>
    <span class="spacer"></span>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <button id="lockBtn" type="button">Lock</button>
</header>

<main id="main-content" tabindex="-1">
    <section class="hub" id="hub">
        <div class="hub-head">
            <h2>Hub / devices</h2>
            <span class="hint" id="hubHint"></span>
            <button id="hubRefresh" type="button">Refresh</button>
        </div>
        <div id="hubBody" aria-live="polite"></div>
    </section>
    <div id="log" role="log" aria-live="polite">
        <div class="empty" id="empty">
            <h1>Ask the agent</h1>
            <p>Answers come from Claude, grounded in the indexed knowledge base.</p>
        </div>
    </div>
    <label class="opts"><input type="checkbox" id="useRag" checked> Search the knowledge base</label>
    <form id="form">
        <label for="prompt" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Question for Jayti Agent</label>
        <textarea id="prompt" name="agent-question" rows="1" placeholder="Ask something…" required></textarea>
        <button class="send" id="sendBtn" type="submit">Send</button>
    </form>
</main>

<script>
(function () {
    // Credential slot. This MUST match index.html:709 -- it is the one key the
    // whole dashboard shares. Keep it session-scoped; migrate and remove the
    // persistent value left by older builds. Wrapped in try/catch because
    // storage access throws outright in private mode.
    var KEY_STORAGE = 'jbt_stats_key';
    var KEY = '';
    try {
        KEY = sessionStorage.getItem(KEY_STORAGE) || '';
        if (!KEY) {
            KEY = localStorage.getItem(KEY_STORAGE) || '';
            if (KEY) { sessionStorage.setItem(KEY_STORAGE, KEY); localStorage.removeItem(KEY_STORAGE); }
        }
    } catch (e) { /* private mode */ }
    var $ = function (id) { return document.getElementById(id); };
    var busy = false;

    function showGate(msg) {
        $('gateErr').textContent = msg || '';
        $('gate').hidden = false;
        $('keyInput').focus();
    }

    function add(cls, text, meta) {
        var empty = $('empty'); if (empty) empty.remove();
        var d = document.createElement('div');
        d.className = 'msg ' + cls;
        d.textContent = text;
        if (meta) { var m = document.createElement('span'); m.className = 'meta'; m.textContent = meta; d.appendChild(m); }
        $('log').appendChild(d);
        $('log').scrollTop = $('log').scrollHeight;
        return d;
    }

    function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined && text !== null) n.textContent = text;
        return n;
    }

    // Numbered citations under an answer: the proxy passes through the
    // service's source_docs [{n, doc_id, index_id, score, source, snippet}].
    function addCitations(node, docs) {
        if (!Array.isArray(docs) || !docs.length) return;
        var ol = el('ol', 'cites');
        docs.forEach(function (d, i) {
            var li = el('li');
            if (d.n) li.value = d.n;
            li.appendChild(el('code', '', d.doc_id || d.source || ('doc ' + (i + 1))));
            var snip = String(d.snippet || '').replace(/\s+/g, ' ').trim();
            if (snip.length > 240) snip = snip.slice(0, 240) + '…';
            if (snip) li.appendChild(document.createTextNode(' — ' + snip));
            ol.appendChild(li);
        });
        node.appendChild(ol);
    }

     var agentConversationId = crypto.randomUUID();
     function api(path, init) {
        init = init || {};
        init.headers = Object.assign({ 'x-stats-key': KEY }, init.headers || {});
        return fetch(path, init).then(function (res) {
            return res.json().catch(function () { return {}; }).then(function (j) { return { res: res, j: j }; });
        });
    }

    /* ===== Hub / devices (read-only, via /agent/state) ===== */
    function fmtNum(v) { return v === undefined || v === null ? '–' : Number(v).toLocaleString(); }
    function fmtTime(v) {
        if (!v) return '–';
        var t = new Date(v);
        return isNaN(t.getTime()) ? String(v) : t.toLocaleString();
    }

    function renderHub(box, j) {
        var st = j.status || {};
        var devices = Array.isArray(j.devices) ? j.devices : [];
        box.textContent = '';
        $('hubHint').textContent = [j.hub, st.ts ? 'as of ' + fmtTime(st.ts) : ''].filter(Boolean).join(' · ');

        var kpis = el('div', 'hub-kpis');
        [['devices_active', 'active devices'], ['items_total', 'rows'], ['items_unprocessed', 'unprocessed']].forEach(function (k) {
            var d = el('div');
            d.appendChild(el('b', '', fmtNum(st[k[0]])));
            d.appendChild(el('span', '', k[1]));
            kpis.appendChild(d);
        });
        box.appendChild(kpis);

        if (j.status_error) box.appendChild(el('div', 'hub-err', 'status: ' + j.status_error));
        if (j.devices_error) box.appendChild(el('div', 'hub-err', 'devices: ' + j.devices_error));

        if (!devices.length) { if (!j.devices_error) box.appendChild(el('div', 'hub-err', 'No devices reported.')); return; }
        var wrap = el('div', 'hub-wrap');
        var table = el('table');
        var thead = el('thead'); var hr = el('tr');
        [['Device'], ['Type / OS'], ['Rows', 'num'], ['Unprocessed', 'num'], ['Last ingest']].forEach(function (h) {
            hr.appendChild(el('th', h[1] || '', h[0]));
        });
        thead.appendChild(hr); table.appendChild(thead);
        var tbody = el('tbody');
        devices.forEach(function (d) {
            var tr = el('tr', d.is_active === false ? 'off' : '');
            tr.appendChild(el('td', '', d.device_id || '–'));
            tr.appendChild(el('td', '', [d.device_type, d.os].filter(Boolean).join(' / ') || '–'));
            tr.appendChild(el('td', 'num', fmtNum(d.items)));
            tr.appendChild(el('td', 'num', fmtNum(d.unprocessed)));
            tr.appendChild(el('td', '', fmtTime(d.last_ingest)));
            tbody.appendChild(tr);
        });
        table.appendChild(tbody); wrap.appendChild(table); box.appendChild(wrap);
    }

    var hubBusy = false;
    function loadHubState() {
        if (hubBusy) return Promise.resolve();
        hubBusy = true; $('hubRefresh').disabled = true;
        var box = $('hubBody');
        box.textContent = 'Loading…';
        return api('/agent/state').then(function (r) {
            if (r.res.status === 401) { box.textContent = 'Locked.'; showGate(KEY ? 'That key was not accepted.' : ''); return; }
            if (!r.res.ok) {
                box.textContent = '';
                box.appendChild(el('div', 'hub-err', r.j.missing ? 'Agent not configured: missing ' + r.j.missing.join(', ') : (r.j.error || 'HTTP ' + r.res.status)));
                return;
            }
            renderHub(box, r.j);
        }).catch(function (err) {
            box.textContent = '';
            box.appendChild(el('div', 'hub-err', 'Request failed: ' + (err && err.message || err)));
        }).then(function () { hubBusy = false; $('hubRefresh').disabled = false; });
    }
    $('hubRefresh').addEventListener('click', function () { loadHubState(); });

    function checkHealth() {
        $('status').textContent = 'checking…';
        return api('/agent/health').then(function (r) {
            if (r.res.status === 401) { $('status').textContent = ''; showGate(KEY ? 'That key was not accepted.' : ''); return false; }
            $('status').textContent = r.res.ok
                ? (r.j.model || 'online') + (r.j.retrieval_available === false ? ' · search offline' : '')
                : (r.j.error || 'offline');
            return true;
        }).catch(function () { $('status').textContent = 'offline'; return true; });
    }

    $('unlockBtn').addEventListener('click', function () {
        var v = $('keyInput').value.trim();
        if (!v) return;
        KEY = v;
        try { sessionStorage.setItem(KEY_STORAGE, v); localStorage.removeItem(KEY_STORAGE); } catch (e) {}
        checkHealth().then(function (ok) { if (ok) { $('gate').hidden = true; $('keyInput').value = ''; $('prompt').focus(); loadHubState(); } });
    });
    $('keyInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('unlockBtn').click(); });
    $('lockBtn').addEventListener('click', function () {
        KEY = '';
        try { localStorage.removeItem(KEY_STORAGE); sessionStorage.removeItem(KEY_STORAGE); } catch (e) {}
        showGate();
    });

    $('prompt').addEventListener('input', function () { this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px'; });
    $('prompt').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); }
    });

    $('form').addEventListener('submit', function (e) {
        e.preventDefault();
        var q = $('prompt').value.trim();
        if (!q || busy) return;
        busy = true; $('sendBtn').disabled = true;
        add('user', q);
        $('prompt').value = ''; $('prompt').style.height = 'auto';
        var pending = add('agent', 'Thinking…');

        api('/agent/query', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ query: q, use_rag: $('useRag').checked, conversation_id: agentConversationId, request_id: crypto.randomUUID() })
        }).then(function (r) {
            pending.remove();
            if (r.res.status === 401) { showGate('Your key was not accepted.'); add('err', 'Locked. Unlock and send again.'); return; }
            if (!r.res.ok) {
                var why = r.j.missing ? 'Agent not configured: missing ' + r.j.missing.join(', ') : (r.j.error || 'HTTP ' + r.res.status);
                add('err', why);
                return;
            }
            var meta = [];
            if (r.j.sources) meta.push(r.j.sources + ' source' + (r.j.sources === 1 ? '' : 's'));
            if (r.j.total_time_ms) meta.push((r.j.total_time_ms / 1000).toFixed(1) + 's');
            var answer = add('agent', r.j.response || '(empty response)', meta.join(' · '));
            addCitations(answer, r.j.source_docs);
        }).catch(function (err) {
            pending.remove();
            add('err', 'Request failed: ' + (err && err.message || err));
        }).then(function () { busy = false; $('sendBtn').disabled = false; });
    });

    if (KEY) checkHealth().then(function (ok) { if (ok) loadHubState(); }); else showGate();
})();
</script>
</body>
</html>
