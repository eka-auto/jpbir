name: Vercel Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci
        working-directory: jayti-dashboard

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Pull Vercel Project (setup)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment production --token ${{ secrets.VERCEL_TOKEN }}
        working-directory: jayti-dashboard

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel deploy --prod --yes --token ${{ secrets.VERCEL_TOKEN }} > deploy_out.txt 2>&1
          cat deploy_out.txt
          DEPLOY_URL=$(grep -oE 'https://[a-z0-9-]+\.vercel\.app' deploy_out.txt | head -1)
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
        working-directory: jayti-dashboard

      - name: Alias live domains
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel alias set $DEPLOY_URL jaytipargal.tech --yes --token ${{ secrets.VERCEL_TOKEN }}
          vercel alias set $DEPLOY_URL agent.jaytipargal.tech --yes --token ${{ secrets.VERCEL_TOKEN }}
        working-directory: jayti-dashboard
