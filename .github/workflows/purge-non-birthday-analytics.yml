name: Purge non-birthday analytics

# Removes every property except jaytibirthday.in from the production
# warehouse, and the matching rows from the DynamoDB journal that feeds it.
#
# Why this exists: the operator console at jaytipargal.tech tracked itself,
# so the warehouse held a property whose "visitors" were the owner's own
# sessions and the fleet's own device probes. The owner asked for that data to
# be removed completely, and for the product to be built for jaytibirthday.in
# only.
#
# Two ends, because one end is not enough. The warehouse is what the panels
# read; the journal is what the nightly repair copies FROM. Purging only the
# warehouse would put the rows back at the next repair, so both are purged,
# with the same filter.
#
# The target is proved before anything is written, and proved the only way
# that can be trusted: the deployed application is asked for its own counts of
# every property, and the branch whose counts agree EXACTLY is the one that
# gets purged. A branch that disagrees by one row is not the target.
#
# The Neon API is used rather than a connection string because the
# DATABASE_URL secret's password no longer authenticates (28P01), and a
# password that cannot open the database cannot be used to delete from it.
#
# The trigger is a push to the branch that carries the change, because a
# workflow_dispatch cannot be triggered until it exists on the default branch,
# and the owner asked for the data to be gone now. The job is idempotent:
# running it again deletes nothing.

on:
  push:
    branches:
      - chore/birthday-only-analytics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    name: Purge every property except jaytibirthday.in
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      DB_ADMIN_KEY: ${{ secrets.DB_ADMIN_KEY }}
      JP_AWS_REGION: ${{ secrets.JP_AWS_REGION }}
      JP_AWS_ACCESS_KEY_ID: ${{ secrets.JP_AWS_ACCESS_KEY_ID }}
      JP_AWS_SECRET_ACCESS_KEY: ${{ secrets.JP_AWS_SECRET_ACCESS_KEY }}
      JP_WRITE_AWS_ACCESS_KEY_ID: ${{ secrets.JP_WRITE_AWS_ACCESS_KEY_ID }}
      JP_WRITE_AWS_SECRET_ACCESS_KEY: ${{ secrets.JP_WRITE_AWS_SECRET_ACCESS_KEY }}
      JP_TELEMETRY_TABLE: ${{ secrets.JP_TELEMETRY_TABLE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The target has to be the warehouse the deployed application reads. The
      # application is asked for its own counts; every branch of the project is
      # asked for its own; the one that agrees exactly is the target.
      - name: Prove the target is the deployed application's warehouse
        id: target
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF' > /tmp/target.json
          import { writeFileSync } from 'node:fs';
          const API = 'https://console.neon.tech/api/v2';
          const headers = { Authorization: 'Bearer ' + process.env.NEON_API_KEY, 'Content-Type': 'application/json' };
          const json = async (url, init) => {
            const r = await fetch(url, { headers, ...init });
            if (!r.ok) throw new Error(url + ' -> HTTP ' + r.status + ' ' + (await r.text()).slice(0, 200));
            return r.json();
          };
          const projects = (await json(API + '/projects')).projects || [];
          // The project that owns the branch the local checkout points at. The
          // branch id is the one the local .env.local resolves to, and the
          // project is whichever owns it.
          const STALE_BRANCH = process.env.STALE_BRANCH || 'br-spring-pine-au5jtfig';
          let project = null, stale = null;
          for (const p of projects) {
            const branches = (await json(API + '/projects/' + p.id + '/branches')).branches || [];
            const found = branches.find((b) => b.id === STALE_BRANCH);
            if (found) { project = p; stale = found; break; }
          }
          if (!project) throw new Error('no project owns the branch ' + STALE_BRANCH);
          const branches = (await json(API + '/projects/' + project.id + '/branches')).branches || [];
          const databases = (await json(API + '/projects/' + project.id + '/databases')).databases || [];
          const database = databases.find((d) => d.name === 'neondb') || databases[0];
          if (!database) throw new Error('the project has no database');
          const query = async (branchId, sql) => {
            const r = await json(API + '/projects/' + project.id + '/databases/' + database.name + '/query?branch=' + branchId, {
              method: 'POST', body: JSON.stringify({ query: sql }),
            });
            return (r.data || []).map((row) => Object.fromEntries((r.fields || []).map((f, i) => [f.name, row[i]])));
          };
          const live = await fetch('https://jaytipargal.tech/api/db-push?action=counts', {
            headers: { 'x-db-admin-key': process.env.DB_ADMIN_KEY },
          });
          const app = await live.json();
          const theirs = new Map((app.eventsBySite || []).map((r) => [r.site, r.n]));
          const same = (m) => m.size === theirs.size && [...theirs].every(([k, v]) => m.get(k) === v);
          let match = null;
          for (const b of branches) {
            let counts;
            try {
              counts = await query(b.id, 'select site, count(*)::int n from events group by site order by site');
            } catch (e) {
              console.error('branch ' + b.id + ' could not be read: ' + String(e.message).slice(0, 120));
              continue;
            }
            const m = new Map(counts.map((r) => [r.site, r.n]));
            console.error('branch ' + b.id + ' (' + b.name + '): ' + m.size + ' site(s), matches the application: ' + same(m));
            if (!match && same(m)) match = { branch: b, counts: m };
          }
          if (!match) {
            throw new Error('no branch of ' + project.name + ' holds the warehouse the deployed application reads');
          }
          console.error('target verified: branch ' + match.branch.id + ' (' + match.branch.name + ')');
          writeFileSync('/tmp/target.json', JSON.stringify({
            project_id: project.id, project_name: project.name,
            database: database.name, branch_id: match.branch.id, branch_name: match.branch.name,
            sites: [...theirs].map(([site, n]) => ({ site, n })),
          }));
          EOF
          cat /tmp/target.json

      - name: Show what will be deleted
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const t = JSON.parse(readFileSync('/tmp/target.json', 'utf8'));
          let doomed = 0;
          for (const s of t.sites) {
            if (s.site === 'jaytibirthday.in') { console.log('  keep ' + s.site + ': ' + s.n + ' event(s)'); continue; }
            doomed += s.n;
            console.log('  delete ' + s.site + ': ' + s.n + ' event(s)');
          }
          console.log('total to delete: ' + doomed + ' event(s)');
          EOF

      - name: Delete the rows and record the migration
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const t = JSON.parse(readFileSync('/tmp/target.json', 'utf8'));
          const API = 'https://console.neon.tech/api/v2';
          const headers = { Authorization: 'Bearer ' + process.env.NEON_API_KEY, 'Content-Type': 'application/json' };
          const query = async (sql) => {
            const r = await fetch(API + '/projects/' + t.project_id + '/databases/' + t.database + '/query?branch=' + t.branch_id, {
              method: 'POST', headers, body: JSON.stringify({ query: sql }),
            });
            if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0, 300));
            return r;
          };
          const events = await query("delete from events where site <> 'jaytibirthday.in'");
          const sessions = await query("delete from sessions where site <> 'jaytibirthday.in'");
          const visitors = await query("delete from visitors where site <> 'jaytibirthday.in'");
          await query("insert into schema_migrations (filename, applied_at) values ('016_purge_non_birthday_analytics.sql', now()) on conflict (filename) do nothing");
          const count = (r) => (JSON.parse(r).row_count || 0);
          console.log('deleted ' + count(events) + ' event(s), ' + count(sessions) + ' session(s), ' + count(visitors) + ' visitor(s)');
          EOF

      # The journal is what the nightly repair copies from. Leaving the rows
      # there would put them back at the next repair, and a purge that undoes
      # itself every night is not a purge.
      - name: Delete the matching rows from the DynamoDB journal
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { DynamoDBClient, ScanCommand, DeleteItemCommand } from '@aws-sdk/client-dynamodb';
          const client = new DynamoDBClient({
            region: process.env.JP_AWS_REGION,
            credentials: {
              accessKeyId: process.env.JP_WRITE_AWS_ACCESS_KEY_ID,
              secretAccessKey: process.env.JP_WRITE_AWS_SECRET_ACCESS_KEY,
            },
          });
          const table = process.env.JP_TELEMETRY_TABLE;
          const scan = await client.send(new ScanCommand({ TableName: table }));
          let deleted = 0, kept = 0;
          for (const item of scan.Items || []) {
            const url = item.pageUrl && (item.pageUrl.S || item.pageUrl);
            let host = null;
            try { host = url ? new URL(url).hostname : null; } catch { host = null; }
            const isTracked = host === 'jaytibirthday.in' || (host && host.endsWith('.jaytibirthday.in'));
            if (isTracked) { kept++; continue; }
            await client.send(new DeleteItemCommand({ TableName: table, Key: { id: item.id } }));
            deleted++;
            console.log('  deleted journal item ' + item.id + ' (' + (host || 'no host') + ')');
          }
          console.log('journal: deleted ' + deleted + ', kept ' + kept);
          await client.destroy();
          EOF

      - name: Report the warehouse's new shape
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const t = JSON.parse(readFileSync('/tmp/target.json', 'utf8'));
          const API = 'https://console.neon.tech/api/v2';
          const headers = { Authorization: 'Bearer ' + process.env.NEON_API_KEY, 'Content-Type': 'application/json' };
          const r = await fetch(API + '/projects/' + t.project_id + '/databases/' + t.database + '/query?branch=' + t.branch_id, {
            method: 'POST', headers,
            body: JSON.stringify({ query: 'select site, count(*)::int n from events group by site order by n desc' }),
          });
          const body = await r.json();
          console.log('events by site:');
          for (const row of body.data || []) console.log('  ' + row[0] + ': ' + row[1]);
          const live = await fetch('https://jaytipargal.tech/api/db-push?action=counts', {
            headers: { 'x-db-admin-key': process.env.DB_ADMIN_KEY },
          });
          const app = await live.json();
          console.log('the deployed application now sees:');
          for (const s of app.eventsBySite || []) console.log('  ' + s.site + ': ' + s.n);
          EOF
