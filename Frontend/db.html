<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Data — jaytipargal</title>
<style>
  /* Every panel here is backed by a column that actually has data. Coverage is
     shown on the Health page rather than guessed at, so an empty panel always
     means "no data" and never "field never mapped". */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0B0D10; --panel:#12161B; --panel-2:#171C22; --line:#232B34;
    --ink:#E6EDF3; --ink-dim:#8B98A5; --ink-faint:#5A6672;
    --accent:#4C9AFF; --accent-dim:#1F3A5F;
    --ok:#3FB950; --warn:#D29922; --bad:#F85149; --violet:#A371F7; --teal:#39C5CF;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  ::selection{background:rgba(76,154,255,.3)}

  .shell{display:grid;grid-template-columns:208px 1fr;min-height:100vh}

  /* ---------- sidebar ---------- */
  .side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
  .brand h1{font-size:13px;font-weight:600;letter-spacing:.2px}
  .brand span{display:block;font-size:10px;color:var(--ink-faint);font-family:var(--mono);margin-top:3px}
  .nav{padding:10px 8px;overflow-y:auto;flex:1}
  .nav button{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;margin-bottom:1px;border:0;border-radius:6px;
    background:transparent;color:var(--ink-dim);font:inherit;font-size:12.5px;cursor:pointer;text-align:left}
  .nav button:hover{background:var(--panel-2);color:var(--ink)}
  .nav button.on{background:var(--accent-dim);color:#fff}
  .nav .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55;flex:0 0 auto}
  .nav .count{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
  .side-foot{padding:10px 14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--ink-faint)}

  /* ---------- main ---------- */
  .main{min-width:0;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20;flex-wrap:wrap}
  .bar h2{font-size:14px;font-weight:600;margin-right:auto}
  select,input,.btn{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px 9px;font:inherit;font-size:12px}
  select,.btn{cursor:pointer}
  .btn:hover{border-color:var(--accent);color:#fff}
  .btn.on{background:var(--accent-dim);border-color:var(--accent);color:#fff}
  .wrap{padding:18px 20px 60px;flex:1}
  .page{display:none}
  .page.on{display:block}

  /* ---------- primitives ---------- */
  .grid{display:grid;gap:12px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .cards-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  .cards-3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .card > h3{font-size:11px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-dim);
    padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .card > h3 .tag{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-faint);text-transform:none;letter-spacing:0}
  .card .body{padding:12px 14px}
  .card .body.flush{padding:0}

  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px 15px}
  .kpi .k{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-faint)}
  .kpi .v{font-family:var(--mono);font-size:25px;font-weight:600;margin-top:5px;letter-spacing:-.5px}
  .kpi .s{font-size:11px;color:var(--ink-dim);margin-top:2px}

  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;font-weight:600;font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-faint);
    padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel)}
  td{padding:7px 12px;border-bottom:1px solid rgba(35,43,52,.55);vertical-align:top}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--panel-2)}
  tbody tr.clickable{cursor:pointer}
  td.num,th.num{text-align:right;font-family:var(--mono)}
  .mono{font-family:var(--mono);font-size:11.5px}
  .trunc{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom}
  .scroll{max-height:440px;overflow:auto}

  /* horizontal bar inside a list row — no chart library needed */
  .bars{display:flex;flex-direction:column}
  .bars .row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:6px 14px;position:relative}
  .bars .row + .row{border-top:1px solid rgba(35,43,52,.5)}
  .bars .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(76,154,255,.20),rgba(76,154,255,.05));border-right:1px solid rgba(76,154,255,.35)}
  .bars .lbl,.bars .val{position:relative;z-index:1}
  .bars .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bars .val{font-family:var(--mono);font-size:11.5px;color:var(--ink-dim)}

  .pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10.5px;font-family:var(--mono);border:1px solid}
  .pill.ok{color:var(--ok);border-color:rgba(63,185,80,.45);background:rgba(63,185,80,.10)}
  .pill.warn{color:var(--warn);border-color:rgba(210,153,34,.45);background:rgba(210,153,34,.10)}
  .pill.bad{color:var(--bad);border-color:rgba(248,81,73,.45);background:rgba(248,81,73,.10)}
  .pill.mute{color:var(--ink-faint);border-color:var(--line);background:var(--panel-2)}
  .pill.info{color:var(--teal);border-color:rgba(57,197,207,.45);background:rgba(57,197,207,.10)}

  .empty{padding:22px 14px;text-align:center;color:var(--ink-faint);font-size:12px}
  .err{margin:12px 0;padding:10px 13px;border:1px solid rgba(248,81,73,.4);background:rgba(248,81,73,.08);border-radius:7px;color:#FFB4AE;font-family:var(--mono);font-size:11.5px}
  .pager{display:flex;align-items:center;gap:9px;padding:9px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-dim)}
  .pager .btn{padding:3px 9px}
  .private-gate{max-width:560px;margin:8vh auto 0;padding:26px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .private-gate h3{font-size:16px;margin-bottom:7px}
  .private-gate p{color:var(--ink-dim);margin-bottom:14px}
  .private-gate form{display:flex;gap:8px}
  .private-gate input{min-width:0;flex:1}

  /* coverage meter on the Health page */
  .cov{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;padding:5px 0}
  .cov .track{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
  .cov .fill{height:100%;border-radius:3px}
  .cov .pct{font-family:var(--mono);font-size:11px;text-align:right;color:var(--ink-dim)}

  /* detail drawer */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none}
  .backdrop.on{display:block}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,94vw);background:var(--panel);border-left:1px solid var(--line);
    z-index:61;transform:translateX(100%);transition:transform .22s cubic-bezier(.22,.61,.36,1);display:flex;flex-direction:column}
  .drawer.on{transform:none}
  .drawer header{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .drawer header h3{font-size:13px;font-weight:600;margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .drawer .inner{padding:14px 16px 40px;overflow-y:auto;flex:1}
  .drawer pre{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:11px;overflow-x:auto;
    font-family:var(--mono);font-size:11px;color:var(--ink-dim);white-space:pre-wrap;word-break:break-word}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:3px 12px;font-size:12px;margin-bottom:14px}
  .kv dt{color:var(--ink-faint)}
  .kv dd{font-family:var(--mono);font-size:11.5px;word-break:break-all}

  svg .axis{stroke:var(--line);stroke-width:1}
  svg .gl{stroke:rgba(35,43,52,.65);stroke-width:1}
  svg text{fill:var(--ink-faint);font-family:var(--mono);font-size:9px}

  @media(max-width:880px){
    .shell{grid-template-columns:1fr}
    .side{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto}
    .brand{border-bottom:0;border-right:1px solid var(--line);white-space:nowrap}
    .nav{display:flex;padding:8px;flex:1}
    .nav button{width:auto;white-space:nowrap}
    .nav .count,.side-foot{display:none}
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <h1>Data</h1>
      <span id="brandSub">neon · postgres</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="foot">—</div>
  </aside>

  <div class="main">
    <div class="bar">
      <h2 id="title">Overview</h2>
      <select id="siteSel" title="Property"></select>
      <select id="daysSel" title="Window">
        <option value="1">24 hours</option>
        <option value="7">7 days</option>
        <option value="30" selected>30 days</option>
        <option value="90">90 days</option>
        <option value="3650">All time</option>
      </select>
      <button class="btn" id="noiseBtn" title="Heartbeats and interaction batches outnumber pageviews ~20:1">Noise off</button>
      <button class="btn" id="refreshBtn">Refresh</button>
    </div>

    <div class="wrap">
      <div id="err"></div>
      <section class="page on" id="page-overview"></section>
      <section class="page" id="page-audience"></section>
      <section class="page" id="page-geo"></section>
      <section class="page" id="page-pages"></section>
      <section class="page" id="page-sessions"></section>
      <section class="page" id="page-events"></section>
      <section class="page" id="page-video"></section>
      <section class="page" id="page-devices"></section>
      <section class="page" id="page-s24"></section>
      <section class="page" id="page-whatsapp"></section>
      <section class="page" id="page-letters"></section>
      <section class="page" id="page-emails"></section>
      <section class="page" id="page-health"></section>
    </div>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer">
  <header>
    <h3 id="drawerTitle">Detail</h3>
    <button class="btn" id="drawerClose">Close</button>
  </header>
  <div class="inner" id="drawerBody"></div>
</aside>

<script>
(function () {
  'use strict';

  var API = '/api/db-api';
  function normalizeDashboardKey(value) {
    // Copying a key through chat or rich text can insert invisible format
    // characters. Remove only those known characters, then validate below.
    return String(value || '').replace(/[\u200B-\u200D\u2060\uFEFF]/g, '').trim();
  }
  function isHeaderSafeDashboardKey(value) {
    // Fetch request headers must be byte-safe. Production keys are generated
    // as printable ASCII and are never shorter than 32 characters.
    return /^[\x21-\x7E]{32,256}$/.test(value);
  }
  var storedDashboardKey = normalizeDashboardKey(sessionStorage.getItem('s24DashboardKey'));
  if (storedDashboardKey && !isHeaderSafeDashboardKey(storedDashboardKey)) {
    storedDashboardKey = '';
    sessionStorage.removeItem('s24DashboardKey');
  }
  var state = { site: 'jaytibirthday.in', days: 30, noise: false, page: 'overview',
                offsets: { visitors: 0, sessions: 0, events: 0, video: 0, emails: 0, s24: 0 },
                type: '', s24Dataset: '', s24Section: 'overview',
                s24Key: sessionStorage.getItem('s24DashboardKey') || '', counts: {} };

  var PAGES = [
    ['overview',  'Overview',  null],
    ['audience',  'Audience',  'visitors'],
    ['geo',       'Geography', null],
    ['pages',     'Pages',     null],
    ['sessions',  'Sessions',  'sessions'],
    ['events',    'Events',    'events'],
    ['video',     'Video',     'video_events'],
    ['devices',   'Devices',   'devices'],
    ['s24',       'S24 archive', 's24_records'],
    ['whatsapp',  'WhatsApp',  'wa_chats'],
    ['letters',   'Letters',   'letters'],
    ['emails',    'Email opens', 'email_opens'],
    ['health',    'Health',    null]
  ];

  // ---------- helpers ----------
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function num(n) { return n == null ? '—' : Number(n).toLocaleString('en-IN'); }
  function when(v) {
    if (!v) return '—';
    var d = new Date(v);
    if (isNaN(d)) return esc(v);
    return d.toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });
  }
  function ago(v) {
    if (!v) return '—';
    var s = (Date.now() - new Date(v).getTime()) / 1000;
    if (s < 0) return 'in the future';
    if (s < 60) return Math.round(s) + 's ago';
    if (s < 3600) return Math.round(s / 60) + 'm ago';
    if (s < 86400) return Math.round(s / 3600) + 'h ago';
    return Math.round(s / 86400) + 'd ago';
  }
  function secs(n) {
    if (n == null) return '—';
    if (n < 60) return Math.round(n) + 's';
    if (n < 3600) return Math.floor(n / 60) + 'm ' + Math.round(n % 60) + 's';
    return Math.floor(n / 3600) + 'h ' + Math.round((n % 3600) / 60) + 'm';
  }
  function shortUrl(u) {
    if (!u) return '—';
    try { var x = new URL(u); return (x.pathname === '/' ? x.host : x.host + x.pathname) + (x.search ? x.search.slice(0, 28) + '…' : ''); }
    catch (e) { return String(u).slice(0, 60); }
  }

  // Every draw carries a token. A response whose token is stale is dropped,
  // so two fast Next clicks cannot render page 1 on top of page 2.
  var drawToken = 0;

  function get(view, extra) {
    if (state.s24Key && !isHeaderSafeDashboardKey(state.s24Key)) {
      state.s24Key = '';
      sessionStorage.removeItem('s24DashboardKey');
      renderKeyGate('The dashboard key contains unsupported or invisible characters. Paste the plain-text key again.');
      var invalid = new Error('invalid dashboard key');
      invalid.handled = true;
      return Promise.reject(invalid);
    }
    var q = new URLSearchParams(Object.assign(
      { view: view, site: state.site, days: state.days }, state.noise ? { noise: '1' } : {}, extra || {}));
    // Every view is key-gated now, not just s24, so the key rides on every
    // request rather than only the archive's.
    var headers = state.s24Key ? { 'x-stats-key': state.s24Key } : {};
    return fetch(API + '?' + q.toString(), { cache: 'no-store', headers: headers })
      .then(function (r) { return r.json().then(function (j) { return { status: r.status, json: j }; }); })
      .then(function (result) {
        if (result.status === 401 || result.status === 503) {
          // Drop the bad key and put the gate in front of whichever view asked,
          // so any page can unlock the dashboard — not only the archive.
          state.s24Key = '';
          sessionStorage.removeItem('s24DashboardKey');
          renderKeyGate(result.status === 401
            ? 'That dashboard key was rejected.'
            : ((result.json && result.json.error) || 'The dashboard key is not configured on the server.'));
          var locked = new Error('locked');
          locked.status = result.status;
          locked.handled = true;
          throw locked;
        }
        var j = result.json;
        if (!j.ok) {
          var error = new Error(j.error || ('view ' + view + ' failed'));
          error.status = result.status;
          throw error;
        }
        return j;
      })
      .then(function (j) {
        return j.data;
      });
  }

  function fail(e) {
    // A locked view has already drawn the gate; an error banner on top of it
    // would just be noise.
    if (e && e.handled) return;
    $('err').innerHTML = '<div class="err">' + esc(e && e.message ? e.message : String(e)) + '</div>';
  }
  function clearErr() { $('err').innerHTML = ''; }

  // The key gate, drawn in front of whichever view is active. Since db-api
  // gates every view, any page can be the one that finds the key missing.
  function renderKeyGate(message) {
    var el = document.querySelector('.page.on') || $('page-overview');
    el.innerHTML = '<div class="private-gate"><h3>Dashboard key required</h3>' +
      '<p>' + esc(message || 'Enter the dashboard key to view this data. The key stays in this browser tab and is sent only as a request header.') + '</p>' +
      '<form id="dbUnlock"><input id="dbKeyInput" type="password" autocomplete="current-password" placeholder="Dashboard key" aria-label="Dashboard key">' +
      '<button class="btn" type="submit">Unlock</button></form></div>';
    $('dbUnlock').addEventListener('submit', function (event) {
      event.preventDefault();
      var value = normalizeDashboardKey($('dbKeyInput').value);
      if (!value) return;
      if (!isHeaderSafeDashboardKey(value)) {
        renderKeyGate('The dashboard key must contain 32–256 printable ASCII characters. Rich-text or invisible Unicode characters are not accepted.');
        return;
      }
      state.s24Key = value;
      sessionStorage.setItem('s24DashboardKey', value);
      el.innerHTML = '<div class="empty">Checking key…</div>';
      clearErr();
      draw();
    });
  }

  // ---------- render primitives ----------
  function kpi(label, value, sub) {
    return '<div class="kpi"><div class="k">' + esc(label) + '</div><div class="v">' + esc(value) +
           '</div><div class="s">' + (sub == null ? '&nbsp;' : esc(sub)) + '</div></div>';
  }

  function barList(rows, labelKey, valueKey, opts) {
    opts = opts || {};
    if (!rows || !rows.length) return '<div class="empty">No data in this window</div>';
    var max = rows.reduce(function (m, r) { return Math.max(m, Number(r[valueKey]) || 0); }, 0) || 1;
    return '<div class="bars">' + rows.map(function (r) {
      var v = Number(r[valueKey]) || 0;
      var label = r[labelKey] == null || r[labelKey] === '' ? '(none)' : r[labelKey];
      if (opts.url) label = shortUrl(label);
      var extra = opts.sub ? ' <span style="color:var(--ink-faint)">' + esc(r[opts.sub] || '') + '</span>' : '';
      return '<div class="row" title="' + esc(r[labelKey] || '') + '">' +
        '<div class="fill" style="width:' + (v / max * 100).toFixed(1) + '%"></div>' +
        '<div class="lbl">' + esc(label) + extra + '</div>' +
        '<div class="val">' + num(v) + (r.visitors != null ? ' · ' + num(r.visitors) + 'v' : '') + '</div></div>';
    }).join('') + '</div>';
  }

  function table(cols, rows, opts) {
    opts = opts || {};
    if (!rows || !rows.length) return '<div class="empty">Nothing here yet</div>';
    var head = '<tr>' + cols.map(function (c) {
      return '<th' + (c.num ? ' class="num"' : '') + '>' + esc(c.label) + '</th>';
    }).join('') + '</tr>';
    var body = rows.map(function (r, i) {
      return '<tr class="' + (opts.onRow ? 'clickable' : '') + '" data-i="' + i + '">' + cols.map(function (c) {
        return '<td' + (c.num ? ' class="num"' : '') + '>' + (c.render ? c.render(r) : esc(r[c.key])) + '</td>';
      }).join('') + '</tr>';
    }).join('');
    return '<div class="scroll"><table><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
  }

  // Inline SVG — no chart dependency, and it scales with the container.
  function lineChart(rows, xKey, series, height) {
    height = height || 150;
    if (!rows || rows.length < 2) return '<div class="empty">Not enough points to plot</div>';
    var W = 760, H = height, PL = 38, PR = 10, PT = 10, PB = 20;
    var max = 1;
    series.forEach(function (s) { rows.forEach(function (r) { max = Math.max(max, Number(r[s.key]) || 0); }); });
    var x = function (i) { return PL + i * (W - PL - PR) / (rows.length - 1); };
    var y = function (v) { return PT + (1 - (Number(v) || 0) / max) * (H - PT - PB); };
    var grid = '', ticks = 4;
    for (var g = 0; g <= ticks; g++) {
      var gy = PT + g * (H - PT - PB) / ticks;
      grid += '<line class="gl" x1="' + PL + '" y1="' + gy + '" x2="' + (W - PR) + '" y2="' + gy + '"/>' +
              '<text x="' + (PL - 6) + '" y="' + (gy + 3) + '" text-anchor="end">' +
              num(Math.round(max * (1 - g / ticks))) + '</text>';
    }
    var paths = series.map(function (s) {
      var d = rows.map(function (r, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(r[s.key]).toFixed(1); }).join(' ');
      var area = d + ' L' + x(rows.length - 1).toFixed(1) + ' ' + (H - PB) + ' L' + x(0).toFixed(1) + ' ' + (H - PB) + ' Z';
      return '<path d="' + area + '" fill="' + s.color + '" opacity=".10"/>' +
             '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="1.8" stroke-linejoin="round"/>';
    }).join('');
    var labels = rows.map(function (r, i) {
      if (rows.length > 10 && i % Math.ceil(rows.length / 8)) return '';
      var t = String(r[xKey]).slice(5, 10);
      return '<text x="' + x(i).toFixed(1) + '" y="' + (H - 5) + '" text-anchor="middle">' + esc(t) + '</text>';
    }).join('');
    var legend = series.map(function (s) {
      return '<span style="color:' + s.color + ';font-family:var(--mono);font-size:10.5px;margin-right:12px">■ ' + esc(s.label) + '</span>';
    }).join('');
    return '<div style="margin-bottom:6px">' + legend + '</div>' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">' + grid + paths +
      '<line class="axis" x1="' + PL + '" y1="' + (H - PB) + '" x2="' + (W - PR) + '" y2="' + (H - PB) + '"/>' + labels + '</svg>';
  }

  function barChart(rows, xKey, yKey, height) {
    height = height || 130;
    if (!rows || !rows.length) return '<div class="empty">No data</div>';
    var W = 760, H = height, PL = 38, PR = 10, PT = 10, PB = 20;
    var max = rows.reduce(function (m, r) { return Math.max(m, Number(r[yKey]) || 0); }, 0) || 1;
    var bw = (W - PL - PR) / rows.length;
    var bars = rows.map(function (r, i) {
      var v = Number(r[yKey]) || 0;
      var h = (v / max) * (H - PT - PB);
      return '<rect x="' + (PL + i * bw + bw * 0.14).toFixed(1) + '" y="' + (H - PB - h).toFixed(1) +
        '" width="' + (bw * 0.72).toFixed(1) + '" height="' + h.toFixed(1) +
        '" fill="var(--accent)" opacity=".75"><title>' + esc(r[xKey]) + ': ' + num(v) + '</title></rect>';
    }).join('');
    var labels = rows.map(function (r, i) {
      if (rows.length > 14 && i % 3) return '';
      return '<text x="' + (PL + i * bw + bw / 2).toFixed(1) + '" y="' + (H - 5) + '" text-anchor="middle">' + esc(r[xKey]) + '</text>';
    }).join('');
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">' + bars +
      '<line class="axis" x1="' + PL + '" y1="' + (H - PB) + '" x2="' + (W - PR) + '" y2="' + (H - PB) + '"/>' + labels + '</svg>';
  }

  // ---------- shared wiring ----------
  function pager(key, res) {
    var total = Number(res.total) || 0;
    var from = total ? res.offset + 1 : 0, to = Math.min(res.offset + res.limit, total);
    var attrs = ' data-pg="' + key + '" data-step="' + res.limit + '" data-total="' + res.total + '"';
    return '<div class="pager">' +
      '<button class="btn"' + attrs + ' data-dir="-1"' + (res.offset ? '' : ' disabled') + '>Prev</button>' +
      '<button class="btn"' + attrs + ' data-dir="1"' + (to >= res.total ? ' disabled' : '') + '>Next</button>' +
      '<span>' + num(res.total ? from : 0) + '–' + num(Math.max(to, 0)) + ' of ' + num(res.total) + '</span></div>';
  }

  function wireRows(root, rows, onClick) {
    Array.prototype.forEach.call(root.querySelectorAll('tr.clickable'), function (tr) {
      tr.addEventListener('click', function () {
        var row = rows[Number(tr.getAttribute('data-i'))];
        if (row) onClick(row);
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-pg]'), function (b) {
      b.addEventListener('click', function () {
        if (b.disabled) return;
        var k = b.getAttribute('data-pg');
        var step = Number(b.getAttribute('data-step')) || 100;
        var cap = Math.max(0, (Number(b.getAttribute('data-total')) || 0) - 1);
        // Clamp. Turning the noise filter back on shrinks the result set, and an
        // offset left past the new end printed ranges like "2,001-500 of 500".
        state.offsets[k] = Math.min(cap, Math.max(0, state.offsets[k] + Number(b.getAttribute('data-dir')) * step));
        draw();
      });
    });
  }

  // ---------- shell ----------
  function buildNav() {
    $('nav').innerHTML = PAGES.map(function (p) {
      return '<button data-page="' + p[0] + '" class="' + (state.page === p[0] ? 'on' : '') + '">' +
        '<span class="dot"></span>' + esc(p[1]) +
        (p[2] ? '<span class="count" data-count="' + p[2] + '"></span>' : '') + '</button>';
    }).join('');
    Array.prototype.forEach.call($('nav').querySelectorAll('[data-page]'), function (b) {
      b.addEventListener('click', function () {
        state.page = b.getAttribute('data-page');
        buildNav();
        draw();
      });
    });
    applyCounts();
  }

  function applyCounts() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-count]'), function (el) {
      var v = state.counts[el.getAttribute('data-count')];
      el.textContent = v == null ? '' : num(v);
    });
  }

  function draw() {
    clearErr();
    var id = 'page-' + state.page;
    Array.prototype.forEach.call(document.querySelectorAll('.page'), function (p) {
      p.classList.toggle('on', p.id === id);
    });
    var page = PAGES.filter(function (p) { return p[0] === state.page; })[0];
    $('title').textContent = page ? page[1] : state.page;
    var el = $(id);
    if (!el.innerHTML) el.innerHTML = '<div class="empty">Loading…</div>';
    var token = ++drawToken;
    var render = RENDER[state.page] || function () { return Promise.resolve(); };
    render().catch(function (e) {
      if (token !== drawToken) return;
      // A handled lock has already drawn the unlock form into this very
      // element. Overwriting it with an error view would leave the operator
      // locked out with no way back in.
      if (e && e.handled) return;
      // Write the failure into the page itself. Sending it only to the shared
      // banner left the page stuck on "Loading…", and the next draw wiped the
      // banner — so the error vanished with nothing to show for it.
      el.innerHTML = '<div class="err">' + esc(e && e.message ? e.message : String(e)) + '</div>';
      fail(e);
    });
  }

  function boot() {
    // Resolve the property list BEFORE the first draw. Drawing first meant that
    // when the default property had no rows, the first paint showed all-zero
    // KPIs while the dropdown beside it already named a different, real one.
    get('sites').then(function (sites) {
      $('siteSel').innerHTML = sites.map(function (s) {
        return '<option value="' + esc(s.site) + '">' + esc(s.site) + ' · ' + num(s.events) + '</option>';
      }).join('');
      if (sites.length && !sites.some(function (s) { return s.site === state.site; })) state.site = sites[0].site;
      $('siteSel').value = state.site;
    }).catch(fail).then(function () {
      buildNav();
      draw();
      return refreshCounts();
    });
  }

  function refreshCounts() {
    return get('health').then(function (h) {
      // Site-scoped, because the pages these badges label are themselves
      // site-filtered. A global total beside a filtered page reads as a bug.
      state.counts = h.countsForSite || h.counts || {};
      applyCounts();
      $('foot').textContent = num((h.counts || {}).events) + ' events, all properties · ' +
        (h.span && h.span.newest ? ago(h.span.newest) : '—');
    }).catch(fail);
  }

  function resetPaging() { state.offsets = { visitors: 0, sessions: 0, events: 0, video: 0, emails: 0, s24: 0, whatsapp: 0 }; }

  $('siteSel').addEventListener('change', function () {
    state.site = this.value;
    resetPaging();
    // A type chip from the previous property may not exist in the new one,
    // which rendered "0 matching" with no chip lit and no obvious way back.
    state.type = '';
    Array.prototype.forEach.call(document.querySelectorAll('.page'), function (p) { p.innerHTML = ''; });
    draw();
    refreshCounts();
  });
  $('daysSel').addEventListener('change', function () { state.days = Number(this.value); resetPaging(); draw(); });
  $('noiseBtn').addEventListener('click', function () {
    state.noise = !state.noise;
    this.classList.toggle('on', state.noise);
    this.textContent = state.noise ? 'Noise on' : 'Noise off';
    resetPaging();
    draw();
  });
  $('refreshBtn').addEventListener('click', draw);

  boot();
})();
</script>
</body>
</html>
