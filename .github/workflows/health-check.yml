name: Endpoint Health Check

on:
  deployment_status:
  schedule:
    - cron: '*/15 * * * *'  # Run every 15 minutes
  workflow_dispatch:

jobs:
  health-check:
    name: Check Endpoint Health
    runs-on: ubuntu-latest
    if: github.event.deployment_status.state == 'success' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      
      - name: Wait for deployment (if triggered by deployment)
        if: github.event_name == 'deployment_status'
        run: sleep 30
        shell: bash
      
      - name: Test Homepage
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://jpbirrestructured.vercel.app/)
          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ Homepage OK"
          else
            echo "❌ Homepage failed with status $RESPONSE"
            exit 1
          fi
      
      # These two are key-gated, and this probe is unauthenticated on purpose —
      # putting the dashboard key in CI just to ping a route is a worse trade
      # than reading 401 for what it is. A 401 means the function ran, reached
      # the guard and refused, which is exactly healthy. A 503 means STATS_KEY
      # is missing on the deployment, and a 5xx means the route is broken, so
      # both still fail the check.
      - name: Test Devices API
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://jpbirrestructured.vercel.app/api/jp-devices)
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 401 ]; then
            echo "✅ Devices API OK (HTTP $RESPONSE)"
          else
            echo "❌ Devices API failed with status $RESPONSE"
            exit 1
          fi

      - name: Test Stats API
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://jpbirrestructured.vercel.app/api/jp-stats)
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 401 ]; then
            echo "✅ Stats API OK (HTTP $RESPONSE)"
          else
            echo "❌ Stats API failed with status $RESPONSE"
            exit 1
          fi
      
      - name: Test Database Verification
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://jpbirrestructured.vercel.app/api/verify-db)
          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ Database Verification OK"
          else
            echo "❌ Database Verification failed with status $RESPONSE"
            exit 1
          fi
      
      - name: Report Status
        run: |
          echo "## ✅ All Endpoints Healthy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoint | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Homepage | ✅ OK |" >> $GITHUB_STEP_SUMMARY
          echo "| Devices API | ✅ OK |" >> $GITHUB_STEP_SUMMARY
          echo "| Stats API | ✅ OK |" >> $GITHUB_STEP_SUMMARY
          echo "| Database Verification | ✅ OK |" >> $GITHUB_STEP_SUMMARY
